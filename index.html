<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#161616">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rellotge">
    <title>Rellotge Mondaine Stop2Go & Calendari</title>
    <!-- App instal·lable -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script>
        // S'aplica el tema abans de pintar la pàgina, per evitar un parpelleig fosc→clar en carregar
        (function () {
            var override = null;
            try { override = localStorage.getItem('mondaineThemeOverride'); } catch (e) {}
            var h = new Date().getHours();
            document.documentElement.setAttribute('data-theme', override || ((h >= 7 && h < 20) ? 'light' : 'dark'));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">

    <style>
        :root {
            --mondaine-red: #e30613;
            --mondaine-black: #000000;
            /* Fons uniforme: la pantalla i la targeta tenen el mateix color en cada mode */
            --bg-color: #161616;
            --card-bg: #161616;
            --widget-bg: #262626;
            --widget-text: #a0a0a5;
            --text-color: #ffffff;
            --border-color: #2a2a2a;
            --border-color-soft: #333333;
            --nav-active-bg: rgba(255, 255, 255, 0.08);
            --card-shadow: rgba(0, 0, 0, 0.6);
            --today-text: #ffffff;
            --today-glow: rgba(227, 6, 19, 0.6);
            --transition-theme: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        html[data-theme="light"] {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --widget-bg: #f1f2f5;
            --widget-text: #6c7076;
            --text-color: #18181a;
            --border-color: #dde0e4;
            --border-color-soft: #e4e6ea;
            --nav-active-bg: rgba(0, 0, 0, 0.06);
            --card-shadow: rgba(30, 30, 40, 0.18);
        }

        /* Mode zz (tauleta de nit): tot negre amb un sol to taronja.
           Per tornar al vermell pur de la imatge de referència, canvia --zz per #ff0000 i --zz-rgb per 255, 0, 0 */
        html[data-theme="zz"] {
            --zz: #ff4500;
            --zz-rgb: 255, 69, 0;
            --zz-dim: rgba(var(--zz-rgb), 0.45);
            --mondaine-red: var(--zz);
            --bg-color: #000000;
            --card-bg: #000000;
            --widget-bg: #000000;
            --widget-text: rgba(var(--zz-rgb), 0.6);
            --text-color: var(--zz);
            --border-color: rgba(var(--zz-rgb), 0.14);
            --border-color-soft: rgba(var(--zz-rgb), 0.22);
            --nav-active-bg: rgba(var(--zz-rgb), 0.14);
            --card-shadow: transparent;
            --today-text: #000000;
            --today-glow: rgba(var(--zz-rgb), 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* Fins que el tema no està aplicat, cap transició (evita animar el canvi inicial) */
        html:not(.theme-ready) *,
        html:not(.theme-ready) body {
            transition: none !important;
        }

        body {
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vh, 24px);
            /* Respecta la "illa" / notch de l'iPhone, sobretot en horitzontal */
            padding-top: max(clamp(8px, 2vh, 24px), env(safe-area-inset-top));
            padding-bottom: max(clamp(8px, 2vh, 24px), env(safe-area-inset-bottom));
            padding-left: max(clamp(8px, 2vh, 24px), env(safe-area-inset-left));
            padding-right: max(clamp(8px, 2vh, 24px), env(safe-area-inset-right));
            color: var(--text-color);
            transition: var(--transition-theme);
            /* Evita el zoom per doble toc quan es premen les fletxes ràpidament */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .app-card {
            position: relative;
            background-color: var(--card-bg);
            border-radius: clamp(16px, 4vw, 28px);
            box-shadow: none;
            border: none;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 100%;
            padding: clamp(12px, 3vh, 24px);
            transition: var(--transition-theme);
            display: grid;
            grid-template-areas:
                "clock"
                "info"
                "calendar";
            /* minmax(0, 1fr): sense això, la franja lliscable d'indicadors eixampla la columna
               i desplaça el rellotge i el calendari fora de la pantalla */
            grid-template-columns: minmax(0, 1fr);
            /* La fila del rellotge s'emporta l'espai sobrant (el rellotge es dimensiona per JS) */
            grid-template-rows: minmax(0, 1fr) auto auto;
            align-items: stretch;
            gap: clamp(8px, 2vh, 20px);
            overflow: hidden;
        }

        .clock-section,
        .info-section,
        .calendar-section {
            min-width: 0;
        }

        .clock-section {
            grid-area: clock;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .clock-svg {
            width: min(62vw, 38vh, 300px);
            height: auto;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: clamp(6px, 1.5vh, 16px);
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.4));
            flex-shrink: 0;
        }

        .hand-shadow {
            filter: drop-shadow(2px 5px 5px rgba(0, 0, 0, 0.35));
        }

        .info-section {
            grid-area: info;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.2vh, 12px);
        }

        .widgets-container {
            width: 100%;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            gap: clamp(6px, 1.2vh, 10px);
            padding-right: 24px;
            flex-shrink: 0;
        }

        .widgets-container::-webkit-scrollbar {
            display: none;
        }

        /* Difuminat a les vores per indicar que hi ha més indicadors a banda i banda */
        .widgets-container.fade-right {
            -webkit-mask-image: linear-gradient(to right, #000 82%, transparent);
            mask-image: linear-gradient(to right, #000 82%, transparent);
        }

        .widgets-container.fade-left {
            -webkit-mask-image: linear-gradient(to left, #000 82%, transparent);
            mask-image: linear-gradient(to left, #000 82%, transparent);
        }

        .widgets-container.fade-left.fade-right {
            -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
        }

        @media (hover: hover) and (pointer: fine) {
            .widgets-container {
                cursor: grab;
            }

            .widgets-container.dragging {
                cursor: grabbing;
                scroll-snap-type: none;
                user-select: none;
            }
        }

        /* Cada indicador és una "pastilla" amb la icona al costat del valor: ocupa just el que necessita */
        .widget {
            flex: 0 0 auto;
            min-width: 0;
            background-color: var(--widget-bg);
            border-radius: 14px;
            padding: clamp(7px, 1.1vh, 10px) 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--border-color-soft);
            overflow: hidden;
            scroll-snap-align: start;
            transition: var(--transition-theme);
        }

        .widget-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--widget-text);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .widget-value,
        .location-value {
            font-size: clamp(0.85rem, 3.9vw, 1rem);
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.1;
            white-space: nowrap;
        }

        /* La població s'adapta a la llargada del nom (fins a un màxim) */
        .widget--location {
            max-width: 230px;
        }

        .location-value {
            min-width: 0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calendar-section {
            grid-area: calendar;
            position: relative;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--widget-bg);
            padding: clamp(8px, 1.5vh, 18px);
            border-radius: 20px;
            border: 1px solid var(--border-color-soft);
            overflow: hidden;
            transition: var(--transition-theme);
        }

        .holiday-tooltip {
            position: fixed;
            z-index: 50;
            transform: translate(-50%, -100%);
            background-color: #000000;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--mondaine-red);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .holiday-tooltip.visible {
            opacity: 1;
        }

        .holiday-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #000000;
        }

        .calendar-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 14px);
            margin-bottom: clamp(4px, 1vh, 16px);
            flex-shrink: 0;
        }

        .calendar-header {
            text-align: center;
            font-weight: 700;
            font-size: clamp(0.9rem, 3vw, 1.25rem);
            text-transform: capitalize;
            color: var(--text-color);
            min-width: 0;
            padding: 4px 6px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .cal-nav-btn {
            background: none;
            border: none;
            color: var(--widget-text);
            font-size: clamp(1rem, 3vw, 1.3rem);
            line-height: 1;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .cal-nav-btn:active {
            background-color: var(--nav-active-bg);
        }

        .cal-nav-btn {
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .calendar-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, auto);
            gap: clamp(4px, 1vh, 10px);
            text-align: center;
            align-items: center;
            justify-items: center;
        }

        .day-name {
            font-weight: 600;
            font-size: clamp(0.6rem, min(2vw, 2.4vh), 0.85rem);
            color: var(--widget-text);
        }

        .day {
            position: relative;
            font-size: clamp(0.65rem, min(2.2vw, 2.6vh), 0.95rem);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.9em;
            height: 1.9em;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .day.today .day-number {
            background-color: var(--mondaine-red);
            color: var(--today-text);
            font-weight: 700;
            box-shadow: 0 0 12px var(--today-glow);
        }

        .day.holiday:not(.today) .day-number {
            color: var(--mondaine-red);
            font-weight: 700;
        }

        .day.holiday::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--mondaine-red);
        }

        .day.today.holiday::after {
            background-color: var(--today-text);
        }

        .day.empty {
            visibility: hidden;
        }

        /* Botons de la cantonada: anunci horari i tema */
        .corner-controls {
            position: absolute;
            top: clamp(8px, 2vh, 14px);
            right: clamp(8px, 2vh, 14px);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .ctrl-btn {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: var(--widget-bg);
            border: 1px solid var(--border-color-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: var(--transition-theme);
            -webkit-touch-callout: none;
        }

        .ctrl-btn:active {
            background-color: var(--nav-active-bg);
        }

        .ctrl-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: none;
        }

        .theme-toggle-btn.light .icon-sun,
        .theme-toggle-btn.dark .icon-moon,
        .theme-toggle-btn.zz .icon-zz,
        .voice-toggle-btn.off .icon-voice-off,
        .voice-toggle-btn.always .icon-voice-on,
        .voice-toggle-btn.day .icon-voice-on {
            display: block;
        }

        .voice-toggle-btn.off svg {
            stroke: var(--widget-text);
        }

        /* Puntet vermell: tema forçat manualment */
        .ctrl-btn .auto-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--mondaine-red);
            border: 1.5px solid var(--card-bg);
            display: none;
        }

        .theme-toggle-btn.manual .auto-dot {
            display: block;
        }

        /* Petit sol: anunci només de dia (7 h – 23 h) */
        .voice-day-badge {
            position: absolute;
            right: -4px;
            bottom: -4px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color-soft);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .voice-toggle-btn.day .voice-day-badge {
            display: flex;
        }

        .ctrl-btn .voice-day-badge svg {
            display: block;
            width: 11px;
            height: 11px;
            stroke-width: 2.4;
        }

        /* Avís breu en canviar un mode */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            transform: translate(-50%, 12px);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 60;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- Mode zz: el rellotge també passa a negre i taronja, sense ombres ---------- */
        html[data-theme="zz"] .clock-svg,
        html[data-theme="zz"] .hand-shadow,
        html[data-theme="zz"] #dial-marks {
            filter: none;
        }

        html[data-theme="zz"] .clock-dial { fill: #000000; stroke: #000000; }
        html[data-theme="zz"] .clock-brand { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-badge { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-badge-cross { fill: #000000; }
        html[data-theme="zz"] .mark-hour { stroke: var(--zz); }
        html[data-theme="zz"] .mark-minute { stroke: var(--zz-dim); }
        html[data-theme="zz"] .hand { stroke: var(--zz); }
        html[data-theme="zz"] .second-line { stroke: var(--zz-dim); }
        html[data-theme="zz"] .second-dot { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-cap { fill: var(--zz); }

        html[data-theme="zz"] .day:not(.today):not(.holiday) .day-number {
            opacity: 0.8;
        }

        html[data-theme="zz"] .holiday-tooltip,
        html[data-theme="zz"] .toast {
            background-color: #000000;
            color: var(--zz);
            border: 1px solid var(--zz-dim);
        }

        html[data-theme="zz"] .holiday-tooltip::after {
            border-top-color: var(--zz-dim);
        }

        @media (orientation: landscape) {
            .app-card {
                max-width: min(96vw, 1200px);
                /* Calendari + indicadors formen un bloc centrat verticalment al costat del rellotge.
                   La columna dreta té un màxim (calendari compacte) i el rellotge s'emporta la resta */
                grid-template-areas:
                    "clock ."
                    "clock controls"
                    "clock calendar"
                    "clock info"
                    "clock .";
                grid-template-columns: minmax(0, 1fr) minmax(0, clamp(240px, 36vw, 340px));
                grid-template-rows: minmax(0, 1fr) auto auto auto minmax(0, 1fr);
                align-items: stretch;
                column-gap: clamp(12px, 3vw, 40px);
                row-gap: clamp(6px, 1.6vh, 14px);
            }

            /* Els botons passen a la columna dreta, damunt del calendari: mai no tapen res */
            .corner-controls {
                position: static;
                grid-area: controls;
                justify-self: end;
            }

            /* El rellotge es dimensiona segons la seva pròpia columna (abans ho feia segons
               l'amplada de la pantalla i, en pantalles estretes, quedava sota el calendari) */
            .clock-section {
                container-type: size;
                justify-self: stretch;
                align-self: stretch;
            }

            .clock-svg {
                height: auto;
                width: min(32vw, 64vh);
                width: min(100cqw, 100cqh, 560px);
                margin-bottom: 0;
            }

            .calendar-section {
                justify-content: center;
                width: 100%;
            }

            .widget-value,
            .location-value {
                font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            }

            .calendar-header {
                font-size: clamp(0.9rem, 1.8vw, 1.3rem);
                margin-bottom: clamp(2px, 0.8vh, 10px);
            }

            .calendar-grid {
                gap: clamp(3px, 0.8vh, 8px);
            }

            .day-name {
                font-size: clamp(0.6rem, 1.3vw, 0.85rem);
            }

            .day {
                font-size: clamp(0.65rem, 1.4vw, 0.9rem);
            }

            .day-number {
                width: 1.8em;
                height: 1.8em;
            }

            .info-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="corner-controls">
        <button class="ctrl-btn voice-toggle-btn off" id="voiceToggleBtn" type="button" aria-label="Anunci horari: silenciat">
            <svg class="icon-voice-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9h3l5-4v14l-5-4H4z"/>
                <path d="M16 9.5l5 5M21 9.5l-5 5"/>
            </svg>
            <svg class="icon-voice-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9h3l5-4v14l-5-4H4z"/>
                <path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
            </svg>
            <span class="voice-day-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
                </svg>
            </span>
        </button>

        <button class="ctrl-btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Canvia el tema">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5"/>
                <path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
            </svg>
            <svg class="icon-zz" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10h7l-7 9h7M14 4h6l-6 7h6"/>
            </svg>
            <span class="auto-dot"></span>
        </button>
    </div>

    <div class="clock-section">
        <svg class="clock-svg" viewBox="0 0 300 300">
            <defs>
                <radialGradient id="dialGradient" cx="50%" cy="40%" r="70%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="70%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#e2e2e2"/>
                </radialGradient>
                <linearGradient id="bezelGradient" x1="15%" y1="8%" x2="88%" y2="95%">
                    <stop offset="0%" stop-color="#6a6a6a"/>
                    <stop offset="14%" stop-color="#1c1c1c"/>
                    <stop offset="55%" stop-color="#000000"/>
                    <stop offset="100%" stop-color="#000000"/>
                </linearGradient>
                <filter id="markShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="1" dy="1.8" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.4"/>
                </filter>
            </defs>

            <!-- Bisell exterior i fons -->

                <rect class="clock-badge-cross" x="-4.2" y="-1.3" width="8.4" height="2.6" fill="#ffffff"/>

                <text class="clock-brand" x="-8" y="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="400" fill="#000000" text-anchor="end" dominant-baseline="middle" letter-spacing="0.2">Swiss</text>
                <text class="clock-brand" x="8" y="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="400" fill="#000000" text-anchor="start" dominant-baseline="middle" letter-spacing="0.2">Watch</text>

                    <path d="M15 8c1.2-1.2 2.3 1.2 3.5 0s2.3 1.2 3.5 0M15 13c1.2-1.2 2.3 1.2 3.5 0s2.3 1.2 3.5 0"/>

                    <path d="M7 16.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 10.5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1.5z"/>

            <button class="cal-nav-btn" id="nextMonthBtn" type="button" aria-label="Mes següent">›</button>
        </div>

            <div class="day-name">Dl</div>
            <div class="day-name">Dt</div>

<div class="holiday-tooltip" id="holidayTooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    // ---------- Rellotge ----------
    const marksGroup = document.getElementById('dial-marks');
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const isHour = i % 5 === 0;

        const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
        mark.setAttribute("x1", "150");
        mark.setAttribute("y1", "22");
        mark.setAttribute("x2", "150");
        mark.setAttribute("y2", isHour ? "52" : "32");
        mark.setAttribute("stroke", "#000000");
        mark.setAttribute("stroke-width", isHour ? "11" : "3.5");
        mark.setAttribute("stroke-linecap", "butt");
        mark.setAttribute("class", isHour ? "mark-hour" : "mark-minute");
        mark.setAttribute("transform", `rotate(${angle} 150 150)`);
        marksGroup.appendChild(mark);
    }

    const secondHandEl = document.getElementById('secondHand');
    const minuteHandEl = document.getElementById('minuteHand');
    const hourHandEl = document.getElementById('hourHand');

    let currentMinute = -1;
    let currentDateKey = null;

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // Stop2Go: la segonera fa la volta en 58 s i s'atura 2 s a les 12
        const secondAngle = s < 58 ? ((s * 1000 + ms) / 58000) * 360 : 360;
        const minuteAngle = m * 6;
        const hourAngle = ((h % 12) * 30) + (m * 0.5);

        secondHandEl.setAttribute('transform', `rotate(${secondAngle} 150 150)`);
        minuteHandEl.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
        hourHandEl.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

        checkMinute(now);
        requestAnimationFrame(updateClock);
    }

    // Es comprova també amb un temporitzador: requestAnimationFrame s'atura quan la pestanya
    // no es veu, i a l'escriptori volem que l'anunci horari soni igualment
    function checkMinute(now) {
        const m = now.getMinutes();
        if (m !== currentMinute) {
            currentMinute = m;
            onMinuteChange(now);
        }
    }

    setInterval(() => checkMinute(new Date()), 1000);

    function onMinuteChange(now) {
        // Canvi de dia: es compara la data, no l'hora 00:00, perquè si la pàgina estava
        // en segon pla a mitjanit el navegador no executa el rellotge i aquell minut es perdria
        const dateKey = fmtKey(now);
        if (dateKey !== currentDateKey) {
            const firstRun = currentDateKey === null;
            currentDateKey = dateKey;
            if (!firstRun) renderCalendar(0);
        }
        applyTheme();
        maybeAnnounceHour(now);
    }

    // ---------- Festius ----------
    // Festes personals: es marquen cada any, a més de les oficials
    const PERSONAL_HOLIDAYS = {
        '10-01': 'Dia de la República'
    };

    // Còpia de seguretat dels calendaris oficials (font: dades obertes de la Generalitat).
    // Normalment no cal tocar-ho: l'app es baixa la llista oficial i s'actualitza sola.
    const OFFICIAL_HOLIDAYS = {
        2026: {
            '01-01': "Cap d'Any",
            '01-06': 'Reis',
            '04-03': 'Divendres Sant',
            '04-06': 'Dilluns de Pasqua Florida',
            '05-01': 'Festa del Treball',
            '06-24': 'Sant Joan',
            '08-15': "L'Assumpció",
            '09-11': 'Diada Nacional de Catalunya',
            '10-12': "Festa Nacional d'Espanya",
            '12-08': 'La Immaculada',
            '12-25': 'Nadal',
            '12-26': 'Sant Esteve'
        },
        2027: {
            '01-01': "Cap d'Any",
            '01-06': 'Reis',
            '03-26': 'Divendres Sant',
            '03-29': 'Dilluns de Pasqua Florida',
            '05-01': 'Festa del Treball',
            '06-24': 'Sant Joan',
            '09-11': 'Diada Nacional de Catalunya',
            '10-12': "Festa Nacional d'Espanya",
            '11-01': 'Tots Sants',
            '12-06': 'Dia de la Constitució',
            '12-08': 'La Immaculada',
            '12-25': 'Nadal'
        }
    };

    // Per a anys que encara no tenen calendari oficial publicat: regla general (aproximada)
    const GENERIC_FIXED_HOLIDAYS = {
        '01-01': "Cap d'Any",
        '01-06': 'Reis',
        '05-01': 'Festa del Treball',
        '06-24': 'Sant Joan',
        '08-15': "L'Assumpció",
        '09-11': 'Diada Nacional de Catalunya',
        '10-12': "Festa Nacional d'Espanya",
        '11-01': 'Tots Sants',
        '12-06': 'Dia de la Constitució',
        '12-08': 'La Immaculada',
        '12-25': 'Nadal',
        '12-26': 'Sant Esteve'
    };

    function pad2(n) {
        return String(n).padStart(2, '0');
    }

    function fmtKey(d) {
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function getEasterSunday(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
    }

    // ---- Festius oficials en línia (dades obertes de la Generalitat) ----
    // Es consulten en obrir l'app i, després, un cop al dia. Si hi ha canvis, el calendari s'actualitza sol.
    const HOLIDAYS_API_URL = 'https://analisi.transparenciacatalunya.cat/resource/8qnu-agns.json?$limit=5000';
    const HOLIDAYS_STORAGE_KEY = 'festiusOficials';
    const HOLIDAYS_REFRESH_MS = 24 * 60 * 60 * 1000;

    let remoteHolidays = loadStoredHolidays();

    function loadStoredHolidays() {
        try {
            const stored = JSON.parse(localStorage.getItem(HOLIDAYS_STORAGE_KEY));
            if (stored && stored.years && typeof stored.fetchedAt === 'number') return stored;
        } catch (e) { /* res desat o format antic */ }
        return { fetchedAt: 0, years: {} };
    }

    function parseHolidayRows(rows) {
        const years = {};
        rows.forEach((row) => {
            const date = typeof row.data === 'string' ? row.data.slice(0, 10) : '';
            const name = typeof row.nom_del_festiu === 'string' ? row.nom_del_festiu.trim() : '';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) return;
            const year = date.slice(0, 4);
            (years[year] = years[year] || {})[date.slice(5)] = name;
        });
        return years;
    }

    async function refreshOfficialHolidays(force) {
        if (!force && Date.now() - remoteHolidays.fetchedAt < HOLIDAYS_REFRESH_MS) return;
        try {
            const response = await fetch(HOLIDAYS_API_URL);
            if (!response.ok) return;
            const rows = await response.json();
            if (!Array.isArray(rows) || rows.length === 0) return;

            const years = parseHolidayRows(rows);
            const changed = JSON.stringify(years) !== JSON.stringify(remoteHolidays.years);
            const hadData = Object.keys(remoteHolidays.years).length > 0;

            remoteHolidays = { fetchedAt: Date.now(), years };
            try { localStorage.setItem(HOLIDAYS_STORAGE_KEY, JSON.stringify(remoteHolidays)); } catch (e) { /* sense espai */ }

            if (changed) {
                holidaysByYear.clear();
                renderCalendar();
                if (hadData) showToast('Calendari de festius actualitzat');
            }
        } catch (e) {
            /* sense connexió: es fan servir les dades desades o les de l'app */
        }
    }

    setInterval(() => {
        if (!document.hidden) refreshOfficialHolidays(false);
    }, 60 * 60 * 1000);

    const holidaysByYear = new Map();

    function getHolidaysForYear(year) {
        if (holidaysByYear.has(year)) return holidaysByYear.get(year);

        const map = new Map();
        // Ordre de preferència: dades oficials en línia → còpia de l'app → regla general
        const official = remoteHolidays.years[year] || OFFICIAL_HOLIDAYS[year];

        if (official) {
            Object.entries(official).forEach(([key, name]) => map.set(`${year}-${key}`, name));
        } else {
            Object.entries(GENERIC_FIXED_HOLIDAYS).forEach(([key, name]) => map.set(`${year}-${key}`, name));
            const easter = getEasterSunday(year);
            const goodFriday = new Date(easter);
            goodFriday.setDate(easter.getDate() - 2);
            const easterMonday = new Date(easter);
            easterMonday.setDate(easter.getDate() + 1);
            map.set(fmtKey(goodFriday), 'Divendres Sant');
            map.set(fmtKey(easterMonday), 'Dilluns de Pasqua Florida');
        }

        Object.entries(PERSONAL_HOLIDAYS).forEach(([key, name]) => {
            const dateKey = `${year}-${key}`;
            map.set(dateKey, map.has(dateKey) ? `${map.get(dateKey)} · ${name}` : name);
        });

        holidaysByYear.set(year, map);
        return map;
    }

    // ---------- Calendari ----------
    let monthOffset = 0;

    function renderCalendar(offset) {
        if (typeof offset === 'number') {
            monthOffset = offset;
        }

        hideHolidayTooltip();

        const realNow = new Date();
        const target = new Date(realNow.getFullYear(), realNow.getMonth() + monthOffset, 1);
        const year = target.getFullYear();
        const month = target.getMonth();
        const isCurrentMonth = monthOffset === 0;
        const today = realNow.getDate();

        const monthName = new Intl.DateTimeFormat('ca-ES', { month: 'long' }).format(target);
        document.getElementById('calendarHeader').innerText = `${monthName} ${year}`;

        const holidays = getHolidaysForYear(year);

        const grid = document.getElementById('calendarGrid');
        grid.querySelectorAll('.day').forEach(d => d.remove());

        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        const totalDays = new Date(year, month + 1, 0).getDate();
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            fragment.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dateKey = `${year}-${pad2(month + 1)}-${pad2(day)}`;
            const holidayName = holidays.get(dateKey);
            const isToday = isCurrentMonth && day === today;

            const dayCell = document.createElement('div');
            dayCell.className = `day ${isToday ? 'today' : ''} ${holidayName ? 'holiday' : ''}`.trim();
            if (holidayName) {
                // Sense "title": a l'escriptori mostrava una segona etiqueta del navegador
                // a sobre de la nostra
                dayCell.setAttribute('aria-label', `${day}: ${holidayName}`);
                dayCell.dataset.holidayName = holidayName;
            }

            const dayNumber = document.createElement('span');
            dayNumber.className = 'day-number';
            dayNumber.innerText = day;

            dayCell.appendChild(dayNumber);
            fragment.appendChild(dayCell);
        }

        // Sempre 6 setmanes (42 caselles): el calendari té la mateixa mida tots els mesos
        const trailingEmpty = 42 - (firstDayIndex + totalDays);
        for (let i = 0; i < trailingEmpty; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            fragment.appendChild(emptyCell);
        }

        grid.appendChild(fragment);

        if (typeof sizeClockForPortrait === 'function') {
            requestAnimationFrame(sizeClockForPortrait);
        }
    }

    // ---------- Dades meteorològiques i ubicació ----------
    const REFRESH_INTERVAL_MS = 15 * 60 * 1000;
    let lastFetchTime = 0;
    let lastGeoCoords = null;
    let fetchInProgress = false;

    function setText(id, text) {
        document.getElementById(id).innerText = text;
    }

    function distanceKm(a, b) {
        const R = 6371;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLon = (b.lon - a.lon) * Math.PI / 180;
        const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(x));
    }

    function fetchJson(url) {
        return fetch(url)
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null);
    }

    function fetchLocationData() {
        if (fetchInProgress) return;

        if (!("geolocation" in navigator)) {
            setFallbackData();
            return;
        }

        fetchInProgress = true;

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Sense "elevation=nan": així l'API usa un model d'elevació de 90 m al punt exacte
            // (amb "nan" retornava l'alçada mitjana de tota la cel·la del model, p. ex. 0 m a Barcelona)
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day` +
                `&hourly=weather_code,precipitation_probability&forecast_days=2&timezone=auto`;

            // Només es torna a geolocalitzar la població si t'has mogut més d'1 km
            const coords = { lat, lon };
            const needGeo = !lastGeoCoords || distanceKm(lastGeoCoords, coords) > 1;
            const geoUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`;

            const [weatherData, geoData] = await Promise.all([
                fetchJson(weatherUrl),
                needGeo ? fetchJson(geoUrl) : Promise.resolve(undefined)
            ]);

            const cur = weatherData && weatherData.current;
            setText('tempValue', cur && cur.temperature_2m != null ? `${Math.round(cur.temperature_2m)}°` : '--°');
            setText('feelsValue', cur && cur.apparent_temperature != null ? `${Math.round(cur.apparent_temperature)}°` : '--°');
            setText('humValue', cur && cur.relative_humidity_2m != null ? `${Math.round(cur.relative_humidity_2m)}%` : '--%');
            setText('altValue', weatherData && weatherData.elevation != null ? `${Math.round(weatherData.elevation)}m` : '--m');

            applyWeatherCondition(weatherData);

            if (geoData !== undefined) {
                const place = geoData && (geoData.city || geoData.locality || geoData.principalSubdivision || geoData.countryName);
                setText('cityValue', place || '--');
                if (place) lastGeoCoords = coords;
            }

            lastFetchTime = Date.now();
            fetchInProgress = false;
        }, () => {
            setFallbackData();
            lastFetchTime = Date.now();
            fetchInProgress = false;
        }, {
            timeout: 15000,
            maximumAge: 10 * 60 * 1000
        });
    }

    function setFallbackData() {
        setText('tempValue', '--°');
        setText('feelsValue', '--°');
        setText('humValue', '--%');
        setText('altValue', '--m');
        setText('cityValue', '--');
        setText('weatherCondValue', '--');
    }

    const WEATHER_ICONS = {
        rain: '<path d="M7 16.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 10.5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1.5z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/>',
        fog: '<path d="M7 11.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 5a4 4 0 0 1 .9 7.9"/><path d="M4 15h16M4 18h16M4 12h7"/>',
        snow: '<path d="M7 11.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1z"/><path d="M9 17v4M9 17l-1.7 1M9 17l1.7 1M9 21l-1.7-1M9 21l1.7-1M15 17v4M15 17l-1.7 1M15 17l1.7 1M15 21l-1.7-1M15 21l1.7-1"/>',
        clear: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
        clearNight: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
        cloud: '<path d="M7 16.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 10.5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1.5z"/>'
    };

    const FOG_CODES = [45, 48];
    const SNOW_CODES = [71, 73, 75, 77, 85, 86];
    const RAIN_CODES = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
    const FORECAST_WINDOW_HOURS = 12;

    // Previsió de les properes 12 hores (abans s'usava el dia sencer, i a la nit
    // seguia mostrant la pluja del matí, que ja havia passat)
    function applyWeatherCondition(weatherData) {
        const valueEl = document.getElementById('weatherCondValue');
        const iconEl = document.getElementById('weatherCondIcon');

        const hourly = weatherData && weatherData.hourly;
        const current = weatherData && weatherData.current;
        if (!hourly || !Array.isArray(hourly.time) || !Array.isArray(hourly.weather_code)) {
            valueEl.innerText = '--';
            iconEl.innerHTML = WEATHER_ICONS.cloud;
            return;
        }

        // Hora actual a la zona horària de la ubicació (format "AAAA-MM-DDTHH:00")
        const currentHour = current && current.time ? current.time.slice(0, 13) + ':00' : null;
        let start = currentHour ? hourly.time.findIndex(t => t >= currentHour) : 0;
        if (start < 0) start = 0;

        const codes = hourly.weather_code.slice(start, start + FORECAST_WINDOW_HOURS).filter(c => c != null);
        const probs = (hourly.precipitation_probability || [])
            .slice(start, start + FORECAST_WINDOW_HOURS)
            .filter(p => p != null);
        const maxProb = probs.length ? Math.max(...probs) : null;

        if (codes.length === 0) {
            valueEl.innerText = '--';
            iconEl.innerHTML = WEATHER_ICONS.cloud;
            return;
        }

        let kind, label;
        if (codes.some(c => SNOW_CODES.includes(c))) {
            kind = 'snow';
            label = 'Neu';
        } else if (codes.some(c => RAIN_CODES.includes(c)) || (maxProb !== null && maxProb >= 50)) {
            kind = 'rain';
            label = 'Pluja';
        } else if (codes.some(c => FOG_CODES.includes(c))) {
            kind = 'fog';
            label = 'Boira';
        } else if (codes[0] <= 1) {
            kind = current && current.is_day === 0 ? 'clearNight' : 'clear';
            label = 'Serè';
        } else {
            kind = 'cloud';
            label = 'Núvols';
        }

        if (maxProb !== null && (kind === 'rain' || kind === 'snow')) {
            label += ` ${Math.round(maxProb)}%`;
        }

        iconEl.innerHTML = WEATHER_ICONS[kind];
        valueEl.innerText = label;
    }

    // Les dades es refresquen soles cada 15 min i en tornar a obrir la pestanya
    setInterval(() => {
        if (!document.hidden) fetchLocationData();
    }, REFRESH_INTERVAL_MS);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        onMinuteChange(new Date());
        if (Date.now() - lastFetchTime > REFRESH_INTERVAL_MS) fetchLocationData();
    });

    // ---------- Mida del rellotge en vertical ----------
    function sizeClockForPortrait() {
        const isPortrait = window.matchMedia('(orientation: portrait)').matches;
        const svg = document.querySelector('.clock-svg');
        const appCard = document.querySelector('.app-card');
        const infoSection = document.querySelector('.info-section');
        const calendarSection = document.querySelector('.calendar-section');
        const clockSection = document.querySelector('.clock-section');

        svg.style.width = '';
        svg.style.height = '';

        if (!isPortrait) return;

        requestAnimationFrame(() => {
            const cardStyles = getComputedStyle(appCard);
            const gap = parseFloat(cardStyles.rowGap) || 0;

            const totalHeight = appCard.clientHeight
                - parseFloat(cardStyles.paddingTop)
                - parseFloat(cardStyles.paddingBottom);

            const svgMargin = parseFloat(getComputedStyle(svg).marginBottom) || 0;
            const used = infoSection.offsetHeight + calendarSection.offsetHeight + (gap * 2) + svgMargin;
            const available = totalHeight - used;
            const maxByWidth = clockSection.clientWidth;

            const size = Math.max(120, Math.min(available, maxByWidth, 340));

            if (isFinite(size) && size > 0) {
                svg.style.width = `${size}px`;
                svg.style.height = `${size}px`;
            }
        });
    }

    window.addEventListener('resize', sizeClockForPortrait);
    window.addEventListener('orientationchange', () => setTimeout(sizeClockForPortrait, 250));

    // ---------- Navegació del calendari ----------
    function goToCurrentMonth() {
        if (monthOffset !== 0) renderCalendar(0);
    }

    // Un sol gestor per fletxa: toc curt = canvia de mes; prémer llarg = torna al mes actual.
    // (Abans, amb ratolí, el prémer llarg tornava al mes actual i després igualment avançava un mes.)
    function setupNavButton(el, delta) {
        let pressTimer = null;
        let longPressed = false;

        const start = () => {
            longPressed = false;
            clearTimeout(pressTimer);
            pressTimer = setTimeout(() => {
                longPressed = true;
                goToCurrentMonth();
            }, 550);
        };
        const stop = () => {
            clearTimeout(pressTimer);
            pressTimer = null;
        };

        el.addEventListener('pointerdown', start);
        el.addEventListener('pointerup', stop);
        el.addEventListener('pointerleave', stop);
        el.addEventListener('pointercancel', stop);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        el.addEventListener('click', () => {
            if (longPressed) {
                longPressed = false;
                return;
            }
            renderCalendar(monthOffset + delta);
        });
    }

    setupNavButton(document.getElementById('prevMonthBtn'), -1);
    setupNavButton(document.getElementById('nextMonthBtn'), +1);

    // Doble toc/clic al nom del mes torna al mes actual
    const calendarHeaderEl = document.getElementById('calendarHeader');
    calendarHeaderEl.addEventListener('dblclick', goToCurrentMonth);

    let lastHeaderTap = 0;
    calendarHeaderEl.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastHeaderTap < 350) {
            e.preventDefault();
            goToCurrentMonth();
        }
        lastHeaderTap = now;
    });

    // Lliscar a esquerra/dreta sobre el calendari canvia de mes
    let touchStartX = null;
    let touchStartY = null;

    const calendarSectionEl = document.querySelector('.calendar-section');

    calendarSectionEl.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
    }, { passive: true });

    calendarSectionEl.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;

        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            renderCalendar(dx < 0 ? monthOffset + 1 : monthOffset - 1);
        }
    }, { passive: true });

    // ---------- Etiqueta dels festius ----------
    const holidayTooltip = document.getElementById('holidayTooltip');
    let tooltipHideTimer = null;
    let tooltipOpenCell = null;

    function hideHolidayTooltip() {
        holidayTooltip.classList.remove('visible');
        tooltipOpenCell = null;
        if (tooltipHideTimer) {
            clearTimeout(tooltipHideTimer);
            tooltipHideTimer = null;
        }
    }

    function showHolidayTooltip(cell) {
        const name = cell.dataset.holidayName;
        if (!name) return;

        holidayTooltip.textContent = name;

        const rect = cell.getBoundingClientRect();
        const top = rect.top - 8;
        let left = rect.left + rect.width / 2;
        const margin = 8;
        const halfTooltip = holidayTooltip.offsetWidth / 2 || 60;
        left = Math.min(Math.max(left, margin + halfTooltip), window.innerWidth - margin - halfTooltip);

        holidayTooltip.style.top = `${top}px`;
        holidayTooltip.style.left = `${left}px`;
        holidayTooltip.classList.add('visible');

        tooltipOpenCell = cell;
        if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
        tooltipHideTimer = setTimeout(hideHolidayTooltip, 3000);
    }

    document.getElementById('calendarGrid').addEventListener('click', (e) => {
        const cell = e.target.closest('.day.holiday');
        if (!cell) {
            hideHolidayTooltip();
            return;
        }
        if (tooltipOpenCell === cell) {
            hideHolidayTooltip();
        } else {
            showHolidayTooltip(cell);
        }
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.day.holiday') && !e.target.closest('.holiday-tooltip')) {
            hideHolidayTooltip();
        }
    });

    // ---------- Franja d'indicadors: roda i arrossegament amb ratolí, i difuminat a les vores ----------
    const widgetsContainer = document.getElementById('widgetsContainer');

    function updateWidgetsFade() {
        const maxScroll = widgetsContainer.scrollWidth - widgetsContainer.clientWidth;
        widgetsContainer.classList.toggle('fade-left', widgetsContainer.scrollLeft > 4);
        widgetsContainer.classList.toggle('fade-right', widgetsContainer.scrollLeft < maxScroll - 4);
    }

    widgetsContainer.addEventListener('scroll', updateWidgetsFade, { passive: true });
    window.addEventListener('resize', updateWidgetsFade);

    // La roda vertical del ratolí desplaça la franja en horitzontal (a l'escriptori no hi ha barra)
    widgetsContainer.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        const maxScroll = widgetsContainer.scrollWidth - widgetsContainer.clientWidth;
        if (maxScroll <= 0) return;
        e.preventDefault();
        widgetsContainer.scrollLeft += e.deltaY;
    }, { passive: false });

    // Arrossegar amb el ratolí
    let dragStartX = null;
    let dragStartScroll = 0;

    widgetsContainer.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        dragStartX = e.clientX;
        dragStartScroll = widgetsContainer.scrollLeft;
        widgetsContainer.classList.add('dragging');
        widgetsContainer.setPointerCapture(e.pointerId);
    });

    widgetsContainer.addEventListener('pointermove', (e) => {
        if (dragStartX === null) return;
        widgetsContainer.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
    });

    const endDrag = () => {
        dragStartX = null;
        widgetsContainer.classList.remove('dragging');
    };
    widgetsContainer.addEventListener('pointerup', endDrag);
    widgetsContainer.addEventListener('pointercancel', endDrag);

    // ---------- Avís breu (toast) ----------
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
    }

    // ---------- Tema: automàtic, diürn, nocturn o zz ----------
    // Automàtic segons l'hora local, o forçat amb el botó (cicle: automàtic → diürn → nocturn → zz)
    const THEME_STORAGE_KEY = 'mondaineThemeOverride';
    const THEME_NAMES = { light: 'diürn', dark: 'nocturn', zz: 'zz (tauleta de nit)' };
    const THEME_COLORS = { light: '#ffffff', dark: '#161616', zz: '#000000' };
    let sessionThemeOverride = null;

    function readStorage(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v === null ? fallback : v;
        } catch (e) {
            return fallback;
        }
    }

    function writeStorage(key, value) {
        try {
            if (value === null) localStorage.removeItem(key);
            else localStorage.setItem(key, value);
        } catch (e) {
            /* localStorage no disponible: el valor només dura la sessió */
        }
    }

    function getThemeOverride() {
        return readStorage(THEME_STORAGE_KEY, sessionThemeOverride);
    }

    function setThemeOverride(value) {
        sessionThemeOverride = value;
        writeStorage(THEME_STORAGE_KEY, value);
    }

    function getAutoTheme() {
        const hour = new Date().getHours();
        return (hour >= 7 && hour < 20) ? 'light' : 'dark';
    }

    function applyTheme() {
        const override = getThemeOverride();
        const effective = THEME_NAMES[override] ? override : getAutoTheme();

        if (document.documentElement.getAttribute('data-theme') !== effective) {
            document.documentElement.setAttribute('data-theme', effective);
        }

        const meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', THEME_COLORS[effective]);

        const btn = document.getElementById('themeToggleBtn');
        btn.classList.toggle('light', effective === 'light');
        btn.classList.toggle('dark', effective === 'dark');
        btn.classList.toggle('zz', effective === 'zz');
        btn.classList.toggle('manual', !!THEME_NAMES[override]);
        const label = THEME_NAMES[override]
            ? `Tema forçat: ${THEME_NAMES[override]}. Toca per canviar.`
            : `Tema automàtic (ara ${THEME_NAMES[effective]}). Toca per canviar.`;
        btn.setAttribute('aria-label', label);
        btn.title = label;

        updateWakeLock();
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const order = [null, 'light', 'dark', 'zz'];
        const current = THEME_NAMES[getThemeOverride()] ? getThemeOverride() : null;
        const next = order[(order.indexOf(current) + 1) % order.length];
        setThemeOverride(next);
        applyTheme();
        showToast(next ? `Tema ${THEME_NAMES[next]}` : 'Tema automàtic (dia de 7 a 20 h)');
    });

    // En mode zz la pantalla no s'apaga (tauleta de nit), si el navegador ho permet
    let wakeLock = null;

    async function updateWakeLock() {
        const want = document.documentElement.getAttribute('data-theme') === 'zz' && !document.hidden;
        if (want && !wakeLock && 'wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                wakeLock = null;
            }
        } else if (!want && wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    document.addEventListener('visibilitychange', updateWakeLock);

    // ---------- Anunci horari en francès ----------
    // Modes: silenciat → sempre → només de dia (de 7 h a 23 h)
    const VOICE_STORAGE_KEY = 'mondaineVoiceMode';
    const VOICE_MODES = ['off', 'always', 'day'];
    const VOICE_LABELS = {
        off: 'Anunci horari silenciat',
        always: 'Anunci horari activat',
        day: 'Anunci horari de 7 a 23 h'
    };
    const FRENCH_HOURS = ['minuit', 'une', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze',
        'midi', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf', 'vingt', 'vingt et une',
        'vingt-deux', 'vingt-trois'];

    let voiceMode = readStorage(VOICE_STORAGE_KEY, 'off');
    if (!VOICE_MODES.includes(voiceMode)) voiceMode = 'off';
    let lastAnnounceKey = null;
    let audioCtx = null;

    function frenchHourPhrase(h) {
        if (h === 0) return 'Il est minuit.';
        if (h === 12) return 'Il est midi.';
        return `Il est ${FRENCH_HOURS[h]} heure${h === 1 ? '' : 's'}.`;
    }

    // Tria una veu femenina francesa, preferint les de més qualitat (Premium, Enhanced, Natural…)
    const FEMALE_VOICE_NAMES = ['amélie', 'amelie', 'audrey', 'aurélie', 'aurelie', 'marie', 'virginie', 'julie', 'hortense',
        'denise', 'vivienne', 'eloise', 'éloïse', 'brigitte', 'coralie', 'céline', 'celine', 'léa', 'chantal', 'sylvie',
        'google français', 'google french'];
    const MALE_VOICE_NAMES = ['thomas', 'jacques', 'paul', 'henri', 'claude', 'rémy', 'remy', 'nicolas', 'daniel',
        'sébastien', 'olivier', 'antoine', 'jérôme', 'yves', 'fabrice', 'alain', 'guillaume', 'mathieu', 'remi'];

    function pickFrenchVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
        let best = null;
        let bestScore = -Infinity;
        voices.forEach(v => {
            const name = v.name.toLowerCase();
            let score = 0;
            if (FEMALE_VOICE_NAMES.some(n => name.includes(n))) score += 10;
            if (MALE_VOICE_NAMES.some(n => name.includes(n))) score -= 20;
            if (/^fr[-_]fr/i.test(v.lang)) score += 3;
            if (/premium|enhanced|natural|neural|amélioré|siri/i.test(v.name)) score += 4;
            if (v.localService) score += 1;
            if (score > bestScore) {
                bestScore = score;
                best = v;
            }
        });
        return best;
    }

    // Parla una o diverses frases seguides; la pausa natural entre frases fa l'anunci menys "de megafonia".
    // To una mica més alt i ritme més pausat que el per defecte: sona més dolç i proper.
    function speakFrench(texts, volume = 1) {
        if (!('speechSynthesis' in window)) return;
        const list = Array.isArray(texts) ? texts : [texts];
        const voice = pickFrenchVoice();
        speechSynthesis.cancel();
        list.forEach((text) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            if (voice) u.voice = voice;
            u.rate = 0.86;
            u.pitch = 1.12;
            u.volume = volume;
            speechSynthesis.speak(u);
        });
    }

    function pick(options) {
        return options[Math.floor(Math.random() * options.length)];
    }

    // Anunci amable segons el moment del dia (amb una mica de varietat perquè no soni repetitiu)
    function friendlyAnnouncement(h) {
        const hour = frenchHourPhrase(h);
        if (h >= 5 && h <= 11) return [pick(['Bonjour !', 'Coucou, bonjour !']), hour];
        if (h === 12) return [hour, pick(['Bon appétit !', 'Bonne pause de midi !'])];
        if (h >= 13 && h <= 17) return [hour, pick(['Bon après-midi !', 'Belle après-midi à toi !'])];
        if (h >= 18 && h <= 21) return [pick(['Bonsoir !', 'Bonsoir à toi !']), hour];
        if (h >= 22) return [hour, pick(['Douce soirée.', 'Belle soirée !'])];
        return [hour, 'Douce nuit.'];
    }

    // Dos tons suaus, com un avís d'estació, abans de la veu
    function playChime() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return Promise.resolve();
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

        const start = audioCtx.currentTime + 0.05;
        [[783.99, 0], [659.25, 0.42]].forEach(([freq, offset]) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start + offset);
            gain.gain.exponentialRampToValueAtTime(0.16, start + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + 1.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(start + offset);
            osc.stop(start + offset + 1.4);
        });
        return new Promise(resolve => setTimeout(resolve, 1300));
    }

    function hourKey(now) {
        return `${fmtKey(now)}T${now.getHours()}`;
    }

    function maybeAnnounceHour(now) {
        if (now.getMinutes() !== 0 || now.getSeconds() > 30) return;
        const key = hourKey(now);
        if (key === lastAnnounceKey) return;
        lastAnnounceKey = key;

        const h = now.getHours();
        if (voiceMode === 'off') return;
        if (voiceMode === 'day' && (h < 7 || h > 23)) return;

        playChime().then(() => speakFrench(friendlyAnnouncement(h)));
    }

    function applyVoiceButton() {
        const btn = document.getElementById('voiceToggleBtn');
        VOICE_MODES.forEach(m => btn.classList.toggle(m, m === voiceMode));
        btn.setAttribute('aria-label', VOICE_LABELS[voiceMode]);
        btn.title = VOICE_LABELS[voiceMode];
    }

    document.getElementById('voiceToggleBtn').addEventListener('click', () => {
        voiceMode = VOICE_MODES[(VOICE_MODES.indexOf(voiceMode) + 1) % VOICE_MODES.length];
        writeStorage(VOICE_STORAGE_KEY, voiceMode);
        applyVoiceButton();
        showToast(VOICE_LABELS[voiceMode]);

        // El toc de l'usuari "desbloqueja" l'àudio a l'iPhone, i de pas se sent la veu triada
        if (voiceMode === 'always') {
            playChime().then(() => speakFrench(['Coucou !', "Je te dirai l'heure, à chaque heure pile."]));
        } else if (voiceMode === 'day') {
            speakFrench("D'accord ! Je te dirai l'heure de sept heures à vingt-trois heures.");
        } else if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
        }
    });

    // Si l'anunci ja estava activat d'una altra sessió, el primer toc a la pàgina desbloqueja l'àudio
    document.addEventListener('pointerdown', () => {
        if (voiceMode === 'off') return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !audioCtx) audioCtx = new AC();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        speakFrench(' ', 0);
    }, { once: true, capture: true });

    if ('speechSynthesis' in window) {
        // Algunes plataformes carreguen la llista de veus amb retard
        speechSynthesis.getVoices();
        speechSynthesis.addEventListener?.('voiceschanged', () => speechSynthesis.getVoices());
    }

    // ---------- Inici ----------
    lastAnnounceKey = hourKey(new Date()); // no s'anuncia l'hora només per obrir la pàgina
    applyVoiceButton();
    applyTheme();
    renderCalendar();
    currentDateKey = fmtKey(new Date());
    refreshOfficialHolidays(false);
    fetchLocationData();
    requestAnimationFrame(updateClock);
    sizeClockForPortrait();
    setTimeout(sizeClockForPortrait, 300);
    updateWidgetsFade();

    // Les transicions de tema s'activen només després del primer pintat
    requestAnimationFrame(() => requestAnimationFrame(() => {
        document.documentElement.classList.add('theme-ready');
    }));

    // App instal·lable: el service worker només funciona servit per http(s), no obrint el fitxer directament
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
