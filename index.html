<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellotge Domaine Stop2Go & Calendari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mondaine-red: #e30613;
            --mondaine-black: #000000;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --widget-bg: #f0f2f5;
            --widget-text: #6e6e73;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Targeta principal adaptable */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 420px; /* Per defecte en mòbil */
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: max-width 0.3s ease;
        }

        .clock-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-svg {
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.15));
        }

        .hand-shadow {
            filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.25));
        }

        .widgets-container {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .widget {
            flex: 1;
            background-color: var(--widget-bg);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
        }

        .widget-title {
            font-size: 0.7rem;
            color: var(--widget-text);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .widget-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #000;
        }

        .calendar-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .calendar-header {
            text-align: center;
            font-weight: 700;
            font-size: 1.35rem;
            margin-bottom: 16px;
            text-transform: capitalize;
            color: #000;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--widget-text);
            padding-bottom: 8px;
        }

        .day {
            font-size: 1rem;
            padding: 10px 0;
            border-radius: 10px;
            color: #000;
        }

        .day.today {
            background-color: var(--mondaine-red);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(227, 6, 19, 0.3);
        }

        .day.empty {
            visibility: hidden;
        }

        /* Disseny Responsive per a ordinadors de sobretaula i pantalles amples */
        @media (min-width: 768px) {
            .app-card {
                max-width: 800px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 32px;
                padding: 36px;
                align-items: center;
            }

            .clock-section {
                margin-bottom: 0;
            }

            .clock-svg {
                max-width: 340px;
            }
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="clock-section">
        <svg class="clock-svg" viewBox="0 0 300 300">
            <!-- Bisell exterior -->
            <circle cx="150" cy="150" r="140" fill="#ffffff" stroke="#000000" stroke-width="12"/>

            <!-- Branding principal: "DOMAINE" centrat -->
            <text x="150" y="97" font-family="'Cinzel', 'Trajan Pro', 'Trajan', serif" font-size="13" font-weight="900" letter-spacing="2.6" fill="#000000" text-anchor="middle">MONDAINE</text>

            <!-- Sub-logo centrat com un sol bloc (x=150) -->
            <g transform="translate(107, 103)">
                <!-- Rectangle Vermell -->
                <rect x="0" y="0" width="18" height="11" fill="#e30613"/>
                <!-- Rombe interior blanc -->
                <polygon points="0,5.5 9,0.5 18,5.5 9,10.5" fill="#ffffff"/>
                <line x1="9" y1="0.5" x2="9" y2="10.5" stroke="#e30613" stroke-width="0.8"/>
                <!-- Text del sublogo -->
                <text x="23" y="9" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="8" font-weight="900" letter-spacing="0.5" fill="#000000">SBB CFF FFS</text>
            </g>

            <!-- Marques d'hores i minuts -->
            <g id="dial-marks"></g>

            <!-- Agulla Horària -->
            <line id="hourHand" class="hand-shadow" x1="150" y1="180" x2="150" y2="85" stroke="#000000" stroke-width="18" stroke-linecap="butt"/>

            <!-- Agulla Minutera -->
            <line id="minuteHand" class="hand-shadow" x1="150" y1="180" x2="150" y2="26" stroke="#000000" stroke-width="12" stroke-linecap="butt"/>

            <!-- Segonera Stop2Go (Escurçada) -->
            <g id="secondHand" class="hand-shadow">
                <line x1="150" y1="185" x2="150" y2="76" stroke="#e30613" stroke-width="4.5" stroke-linecap="butt"/>
                <circle cx="150" cy="68" r="12" fill="#e30613"/>
            </g>

            <!-- Caputxó/Eix central vermell -->
            <circle cx="150" cy="150" r="5" fill="#e30613"/>
        </svg>

        <div class="widgets-container">
            <div class="widget">
                <div class="widget-title">TEMP. LOCAL</div>
                <div class="widget-value" id="tempValue">-- °C</div>
            </div>
            <div class="widget">
                <div class="widget-title">ALTITUD</div>
                <div class="widget-value" id="altValue">-- m</div>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-header" id="calendarHeader"></div>
        <div class="calendar-grid" id="calendarGrid">
            <div class="day-name">Dl</div>
            <div class="day-name">Dt</div>
            <div class="day-name">Dc</div>
            <div class="day-name">Dj</div>
            <div class="day-name">Dv</div>
            <div class="day-name">Ds</div>
            <div class="day-name">Dg</div>
        </div>
    </div>
</div>

<script>
    const marksGroup = document.getElementById('dial-marks');
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const isHour = i % 5 === 0;
        
        const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
        mark.setAttribute("x1", "150");
        mark.setAttribute("y1", "22");
        mark.setAttribute("x2", "150");
        mark.setAttribute("y2", isHour ? "52" : "32");
        mark.setAttribute("stroke", "#000000");
        mark.setAttribute("stroke-width", isHour ? "11" : "3.5");
        mark.setAttribute("stroke-linecap", "butt");
        mark.setAttribute("transform", `rotate(${angle} 150 150)`);
        marksGroup.appendChild(mark);
    }

    let currentMinute = -1;

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        let secondAngle = 0;
        if (s < 58) {
            const totalMs = s * 1000 + ms;
            secondAngle = (totalMs / 58000) * 360;
        } else {
            secondAngle = 360;
        }

        const minuteAngle = m * 6;
        const hourAngle = ((h % 12) * 30) + (m * 0.5);

        document.getElementById('secondHand').setAttribute('transform', `rotate(${secondAngle} 150 150)`);
        document.getElementById('minuteHand').setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
        document.getElementById('hourHand').setAttribute('transform', `rotate(${hourAngle} 150 150)`);

        if (m !== currentMinute) {
            currentMinute = m;
            if (h === 0 && m === 0) renderCalendar();
        }

        requestAnimationFrame(updateClock);
    }

    function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        const monthName = new Intl.DateTimeFormat('ca-ES', { month: 'long' }).format(now);
        document.getElementById('calendarHeader').innerText = `${monthName} ${year}`;

        const grid = document.getElementById('calendarGrid');
        const oldDays = grid.querySelectorAll('.day');
        oldDays.forEach(d => d.remove());

        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = `day ${day === today ? 'today' : ''}`;
            dayCell.innerText = day;
            grid.appendChild(dayCell);
        }
    }

    async function fetchLocationData() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&elevation=nan`);
                    const data = await response.json();
                    
                    if(data.current && data.current.temperature_2m !== undefined) {
                        document.getElementById('tempValue').innerText = `${Math.round(data.current.temperature_2m)} °C`;
                    }
                    if(data.elevation !== undefined) {
                        document.getElementById('altValue').innerText = `${Math.round(data.elevation)} m`;
                    }
                } catch (e) {
                    document.getElementById('tempValue').innerText = "31 °C";
                    document.getElementById('altValue').innerText = "95 m";
                }
            }, () => {
                document.getElementById('tempValue').innerText = "31 °C";
                document.getElementById('altValue').innerText = "95 m";
            });
        }
    }

    renderCalendar();
    fetchLocationData();
    requestAnimationFrame(updateClock);
</script>
</body>
</html>
