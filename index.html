            '01-01': "Cap d'Any",
            '01-06': 'Reis',
            '03-26': 'Divendres Sant',
            '03-29': 'Dilluns de Pasqua Florida',
            '05-01': 'Festa del Treball',
            '06-24': 'Sant Joan',
            '09-11': 'Diada Nacional de Catalunya',
            '10-12': "Festa Nacional d'Espanya",
            '11-01': 'Tots Sants',
            '12-06': 'Dia de la Constitució',
            '12-08': 'La Immaculada',
            '12-25': 'Nadal'
        }
    };

    // Per a anys que encara no tenen calendari oficial publicat: regla general (aproximada)
    const GENERIC_FIXED_HOLIDAYS = {
        '01-01': "Cap d'Any",
        '01-06': 'Reis',
        '05-01': 'Festa del Treball',
        '06-24': 'Sant Joan',
        '08-15': "L'Assumpció",
        '09-11': 'Diada Nacional de Catalunya',
        '10-12': "Festa Nacional d'Espanya",
        '11-01': 'Tots Sants',
        '12-06': 'Dia de la Constitució',
        '12-08': 'La Immaculada',
        '12-25': 'Nadal',
        '12-26': 'Sant Esteve'
    };

    function pad2(n) {
        return String(n).padStart(2, '0');
    }

    function fmtKey(d) {
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function getEasterSunday(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
    }

    // ---- Festius oficials en línia (dades obertes de la Generalitat) ----
    // Es consulten en obrir l'app i, després, un cop al dia. Si hi ha canvis, el calendari s'actualitza sol.
    const HOLIDAYS_API_URL = 'https://analisi.transparenciacatalunya.cat/resource/8qnu-agns.json?$limit=5000';
    const HOLIDAYS_STORAGE_KEY = 'festiusOficials';
    const HOLIDAYS_REFRESH_MS = 24 * 60 * 60 * 1000;

    let remoteHolidays = loadStoredHolidays();

    function loadStoredHolidays() {
        try {
            const stored = JSON.parse(localStorage.getItem(HOLIDAYS_STORAGE_KEY));
            if (stored && stored.years && typeof stored.fetchedAt === 'number') return stored;
        } catch (e) { /* res desat o format antic */ }
        return { fetchedAt: 0, years: {} };
    }

    function parseHolidayRows(rows) {
        const years = {};
        rows.forEach((row) => {
            const date = typeof row.data === 'string' ? row.data.slice(0, 10) : '';
            const name = typeof row.nom_del_festiu === 'string' ? row.nom_del_festiu.trim() : '';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) return;
            const year = date.slice(0, 4);
            (years[year] = years[year] || {})[date.slice(5)] = name;
        });
        return years;
    }

    async function refreshOfficialHolidays(force) {
        if (!force && Date.now() - remoteHolidays.fetchedAt < HOLIDAYS_REFRESH_MS) return;
        try {
            const response = await fetch(HOLIDAYS_API_URL);
            if (!response.ok) return;
            const rows = await response.json();
            if (!Array.isArray(rows) || rows.length === 0) return;

            const years = parseHolidayRows(rows);
            const changed = JSON.stringify(years) !== JSON.stringify(remoteHolidays.years);
            const hadData = Object.keys(remoteHolidays.years).length > 0;

            remoteHolidays = { fetchedAt: Date.now(), years };
            try { localStorage.setItem(HOLIDAYS_STORAGE_KEY, JSON.stringify(remoteHolidays)); } catch (e) { /* sense espai */ }

            if (changed) {
                holidaysByYear.clear();
                renderCalendar();
                if (hadData && currentLang === 'ca') showToast(T().holidaysUpdated);
            }
        } catch (e) {
            /* sense connexió: es fan servir les dades desades o les de l'app */
        }
    }

    setInterval(() => {
        if (!document.hidden) refreshOfficialHolidays(false);
    }, 60 * 60 * 1000);

    const holidaysByYear = new Map();

    function getHolidaysForYear(year) {
        if (holidaysByYear.has(year)) return holidaysByYear.get(year);

        const map = new Map();
        // Ordre de preferència: dades oficials en línia → còpia de l'app → regla general
        const official = remoteHolidays.years[year] || OFFICIAL_HOLIDAYS[year];

        if (official) {
            Object.entries(official).forEach(([key, name]) => map.set(`${year}-${key}`, name));
        } else {
            Object.entries(GENERIC_FIXED_HOLIDAYS).forEach(([key, name]) => map.set(`${year}-${key}`, name));
            const easter = getEasterSunday(year);
            const goodFriday = new Date(easter);
            goodFriday.setDate(easter.getDate() - 2);
            const easterMonday = new Date(easter);
            easterMonday.setDate(easter.getDate() + 1);
            map.set(fmtKey(goodFriday), 'Divendres Sant');
            map.set(fmtKey(easterMonday), 'Dilluns de Pasqua Florida');
        }

        Object.entries(PERSONAL_HOLIDAYS).forEach(([key, name]) => {
            const dateKey = `${year}-${key}`;
            map.set(dateKey, map.has(dateKey) ? `${map.get(dateKey)} · ${name}` : name);
        });

        holidaysByYear.set(year, map);
        return map;
    }

    // ---------- Calendari ----------
    let monthOffset = 0;

    function renderCalendar(offset) {
        if (typeof offset === 'number') {
            monthOffset = offset;
        }

        hideHolidayTooltip();

        const realNow = new Date();
        const target = new Date(realNow.getFullYear(), realNow.getMonth() + monthOffset, 1);
        const year = target.getFullYear();
        const month = target.getMonth();
        const isCurrentMonth = monthOffset === 0;
        const today = realNow.getDate();

        const monthName = new Intl.DateTimeFormat(T().locale, { month: 'long' }).format(target);
        document.getElementById('calendarHeader').innerText = `${monthName} ${year}`;

        // Les festes (calendari laboral de Catalunya) només es mostren en català
        const holidays = currentLang === 'ca' ? getHolidaysForYear(year) : new Map();

        const grid = document.getElementById('calendarGrid');
        grid.querySelectorAll('.day').forEach(d => d.remove());

        let firstDayIndex = new Date(year, month, 1).getDay();
        firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        const totalDays = new Date(year, month + 1, 0).getDate();
        const fragment = document.createDocumentFragment();

        // Les caselles buides porten un número invisible: així una fila buida fa la mateixa alçada
        // que una de plena i el calendari (i el rellotge) no salten en canviar de mes
        const makeEmptyCell = () => {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            const filler = document.createElement('span');
            filler.className = 'day-number';
            filler.textContent = '0';
            emptyCell.appendChild(filler);
            return emptyCell;
        };

        for (let i = 0; i < firstDayIndex; i++) {
            fragment.appendChild(makeEmptyCell());
        }

        for (let day = 1; day <= totalDays; day++) {
            const dateKey = `${year}-${pad2(month + 1)}-${pad2(day)}`;
            const holidayName = holidays.get(dateKey);
            const isToday = isCurrentMonth && day === today;

            const dayCell = document.createElement('div');
            const weekday = (firstDayIndex + day - 1) % 7; // 0 = dilluns … 6 = diumenge
            dayCell.className = ['day', isToday && 'today', holidayName && 'holiday',
                weekday === 5 && 'saturday', weekday === 6 && 'sunday']
                .filter(Boolean).join(' ');
            if (holidayName) {
                // Sense "title": a l'escriptori mostrava una segona etiqueta del navegador
                // a sobre de la nostra
                dayCell.setAttribute('aria-label', `${day}: ${holidayName}`);
                dayCell.dataset.holidayName = holidayName;
            }

            const dayNumber = document.createElement('span');
            dayNumber.className = 'day-number';
            dayNumber.innerText = day;

            dayCell.appendChild(dayNumber);
            fragment.appendChild(dayCell);
        }

        // Sempre 6 setmanes (42 caselles): el calendari té la mateixa mida tots els mesos
        const trailingEmpty = 42 - (firstDayIndex + totalDays);
        for (let i = 0; i < trailingEmpty; i++) {
            fragment.appendChild(makeEmptyCell());
        }

        grid.appendChild(fragment);
        // El calendari sempre té la mateixa alçada (6 setmanes): no cal tornar a calcular el rellotge.
        // (Abans es recalculava i, durant un fotograma, el rellotge tornava a la mida per defecte: rebotava.)
    }

    // ---------- Dades meteorològiques i ubicació ----------
    const REFRESH_INTERVAL_MS = 15 * 60 * 1000;
    let lastFetchTime = 0;
    let lastGeoCoords = null;
    let fetchInProgress = false;

    // Últimes dades conegudes (null = sense dada → es mostra "--")
    const wx = { temp: null, feels: null, hum: null, alt: null, city: null, windSpeed: null, windDir: null,
        region: null, country: null, countryCode: null, lat: null, lon: null };

    // Comunitat autònoma, regió, Land… (nivell 4) i, on és el costum, també el departament o comtat (nivell 6)
    const COUNTRIES_WITH_COUNTY = ['FR', 'GB', 'IE', 'US'];

    function placeDetails(geo) {
        if (!geo) return { region: null, country: null, countryCode: null };
        const admin = (geo.localityInfo && Array.isArray(geo.localityInfo.administrative)) ? geo.localityInfo.administrative : [];
        const level6 = admin.find(a => a.adminLevel === 6);
        const parts = [];
        const place = geo.city || geo.locality;
        if (COUNTRIES_WITH_COUNTY.includes(geo.countryCode) && level6 && level6.name && level6.name !== place) parts.push(level6.name);
        if (geo.principalSubdivision && geo.principalSubdivision !== place && !parts.includes(geo.principalSubdivision)) {
            parts.push(geo.principalSubdivision);
        }
        return {
            region: parts.join(' · ') || null,
            country: geo.countryName || null,
            countryCode: geo.countryCode || null
        };
    }

    function setWeather(values) {
        Object.assign(wx, values);
        renderInfo();
    }

    function distanceKm(a, b) {
        const R = 6371;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLon = (b.lon - a.lon) * Math.PI / 180;
        const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(x));
    }

    function fetchJson(url) {
        return fetch(url)
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null);
    }

    function fetchLocationData() {
        if (fetchInProgress) return;

        if (!("geolocation" in navigator)) {
            setFallbackData();
            return;
        }

        fetchInProgress = true;

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Sense "elevation=nan": així l'API usa un model d'elevació de 90 m al punt exacte
            // (amb "nan" retornava l'alçada mitjana de tota la cel·la del model, p. ex. 0 m a Barcelona)
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m` +
                `&hourly=weather_code,precipitation_probability&forecast_days=2&timezone=auto`;

            // Només es torna a geolocalitzar la població si t'has mogut més d'1 km
            const coords = { lat, lon };
            const needGeo = !lastGeoCoords || distanceKm(lastGeoCoords, coords) > 1;
            const geoUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${currentLang}`;

            const [weatherData, geoData] = await Promise.all([
                fetchJson(weatherUrl),
                needGeo ? fetchJson(geoUrl) : Promise.resolve(undefined)
            ]);

            const cur = weatherData && weatherData.current;
            currentWeatherEmoji = cur ? weatherEmoji(cur.weather_code, cur.is_day) : '🌡️';
            const num = v => (v == null || Number.isNaN(Number(v)) ? null : Math.round(Number(v)));
            setWeather({
                lat, lon,
                temp: num(cur && cur.temperature_2m),
                feels: num(cur && cur.apparent_temperature),
                hum: num(cur && cur.relative_humidity_2m),
                alt: num(weatherData && weatherData.elevation),
                windSpeed: num(cur && cur.wind_speed_10m),
                windDir: cur && cur.wind_direction_10m != null ? Number(cur.wind_direction_10m) : null
            });

            applyWeatherCondition(weatherData);

            if (geoData !== undefined) {
                const place = geoData && (geoData.city || geoData.locality || geoData.principalSubdivision || geoData.countryName);
                setWeather({ city: place || null, ...placeDetails(geoData) });
                if (place) lastGeoCoords = coords;
            }

            lastFetchTime = Date.now();
            fetchInProgress = false;
        }, () => {
            setFallbackData();
            lastFetchTime = Date.now();
            fetchInProgress = false;
        }, {
            timeout: 15000,
            maximumAge: 10 * 60 * 1000
        });
    }

    // Emoticona del temps que fa ara (codis WMO d'Open-Meteo)
    let currentWeatherEmoji = '🌡️';

    function weatherEmoji(code, isDay) {
        const day = isDay !== 0;
        if (code == null) return '🌡️';
        if (code === 0) return day ? '☀️' : '🌙';
        if (code === 1) return day ? '🌤️' : '🌙';
        if (code === 2) return day ? '⛅' : '☁️';
        if (code === 3) return '☁️';
        if (code === 45 || code === 48) return '🌫️';
        if (code >= 51 && code <= 57) return '🌦️';
        if (code >= 61 && code <= 67) return '🌧️';
        if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '🌨️';
        if (code >= 80 && code <= 82) return day ? '🌦️' : '🌧️';
        if (code >= 95) return '⛈️';
        return '🌡️';
    }

    function setFallbackData() {
        currentWeatherEmoji = '🌡️';
        lastWeather = null;
        setWeather({ temp: null, feels: null, hum: null, alt: null, city: null, windSpeed: null, windDir: null,
            region: null, country: null, countryCode: null, lat: null, lon: null });
        applyWeatherCondition(null);
    }

    const WEATHER_ICONS = {
        rain: '<path d="M7 16.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 10.5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1.5z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/>',
        fog: '<path d="M7 11.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 5a4 4 0 0 1 .9 7.9"/><path d="M4 15h16M4 18h16M4 12h7"/>',
        snow: '<path d="M7 11.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1z"/><path d="M9 17v4M9 17l-1.7 1M9 17l1.7 1M9 21l-1.7-1M9 21l1.7-1M15 17v4M15 17l-1.7 1M15 17l1.7 1M15 21l-1.7-1M15 21l1.7-1"/>',
        clear: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
        clearNight: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
        cloud: '<path d="M7 16.5a4.5 4.5 0 0 1 .5-8.97A6 6 0 0 1 19 10.5a4 4 0 0 1-1 7.5H8a4 4 0 0 1-1-1.5z"/>'
    };

    const FOG_CODES = [45, 48];
    const SNOW_CODES = [71, 73, 75, 77, 85, 86];
    const RAIN_CODES = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
    const FORECAST_WINDOW_HOURS = 12;

    // Previsió de les properes 12 hores (abans s'usava el dia sencer, i a la nit
    // seguia mostrant la pluja del matí, que ja havia passat)
    function applyWeatherCondition(weatherData) {
        const valueEl = document.getElementById('mForecast');
        const iconEl = document.getElementById('mForecastIcon');

        const hourly = weatherData && weatherData.hourly;
        const current = weatherData && weatherData.current;
        if (!hourly || !Array.isArray(hourly.time) || !Array.isArray(hourly.weather_code)) {
            lastWeather = null;
            valueEl.innerText = '--';
            iconEl.innerHTML = WEATHER_ICONS.cloud;
            return;
        }

        // Hora actual a la zona horària de la ubicació (format "AAAA-MM-DDTHH:00")
        const currentHour = current && current.time ? current.time.slice(0, 13) + ':00' : null;
        let start = currentHour ? hourly.time.findIndex(t => t >= currentHour) : 0;
        if (start < 0) start = 0;

        const codes = hourly.weather_code.slice(start, start + FORECAST_WINDOW_HOURS).filter(c => c != null);
        const probs = (hourly.precipitation_probability || [])
            .slice(start, start + FORECAST_WINDOW_HOURS)
            .filter(p => p != null);
        const maxProb = probs.length ? Math.max(...probs) : null;

        if (codes.length === 0) {
            lastWeather = null;
            valueEl.innerText = '--';
            iconEl.innerHTML = WEATHER_ICONS.cloud;
            return;
        }

        let kind;
        if (codes.some(c => SNOW_CODES.includes(c))) {
            kind = 'snow';
        } else if (codes.some(c => RAIN_CODES.includes(c)) || (maxProb !== null && maxProb >= 50)) {
            kind = 'rain';
        } else if (codes.some(c => FOG_CODES.includes(c))) {
            kind = 'fog';
        } else if (codes[0] <= 1) {
            kind = current && current.is_day === 0 ? 'clearNight' : 'clear';
        } else {
            kind = 'cloud';
        }

        lastWeather = { kind, prob: (kind === 'rain' || kind === 'snow') ? maxProb : null };
        iconEl.innerHTML = WEATHER_ICONS[kind];
        renderWeatherLabel();
    }

    // Es guarda l'última previsió per poder-la traduir en canviar d'idioma sense tornar a consultar
    let lastWeather = null;

    function renderWeatherLabel() {
        if (!lastWeather) return;
        let label = T().weather[lastWeather.kind];
        if (lastWeather.prob !== null) label += ` ${Math.round(lastWeather.prob)}%`;
        document.getElementById('mForecast').innerText = label;
    }

    // Les dades es refresquen soles cada 15 min i en tornar a obrir la pestanya
    setInterval(() => {
        if (!document.hidden) fetchLocationData();
    }, REFRESH_INTERVAL_MS);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        onMinuteChange(new Date());
        if (Date.now() - lastFetchTime > REFRESH_INTERVAL_MS) fetchLocationData();
    });

    // ---------- Mida del rellotge en vertical ----------
    function sizeClockForPortrait() {
        const isPortrait = window.matchMedia('(orientation: portrait)').matches;
        const svg = document.querySelector('.clock-svg');
        const appCard = document.querySelector('.app-card');
        const calendarSection = document.querySelector('.calendar-section');
        const clockSection = document.querySelector('.clock-section');

        // En horitzontal la mida la posa el CSS
        if (!isPortrait) {
            svg.style.width = '';
            svg.style.height = '';
            clockSection.style.paddingTop = '';
            return;
        }

        // Durant el gir 3D les mides de l'esfera no són les reals: no es toca res
        if (svg.parentElement.classList.contains('girant')) return;

        // En vertical es calcula sense buidar la mida actual (així no hi ha cap fotograma intermedi).
        // Tot passa dins del mateix moment: el navegador no arriba a pintar cap mida provisional.
        const cardStyles = getComputedStyle(appCard);
        const gap = parseFloat(cardStyles.rowGap) || 0;
        const totalHeight = appCard.clientHeight
            - parseFloat(cardStyles.paddingTop)
            - parseFloat(cardStyles.paddingBottom);
        const svgMargin = parseFloat(getComputedStyle(svg.parentElement).marginBottom) || 0;
        const available = totalHeight - (calendarSection.offsetHeight + gap + svgMargin);
        const maxByWidth = clockSection.clientWidth;

        const setSize = (size) => {
            const px = `${Math.round(size)}px`;
            if (svg.style.width !== px) {
                svg.style.width = px;
                svg.style.height = px;
            }
        };

        // Opció A: esfera centrada a tota la zona; si toca els botons de les cantonades, s'encongeix
        clockSection.style.paddingTop = '';
        let sizeA = Math.max(120, Math.min(available, maxByWidth, 420));
        setSize(sizeA);
        for (let i = 0; i < 4; i++) {
            const gapToButtons = minButtonClearance(svg);
            if (gapToButtons >= 6 || sizeA <= 120) break;
            sizeA = Math.max(120, sizeA - (6 - gapToButtons) * 2.2);
            setSize(sizeA);
        }

        // Opció B: l'esfera comença just sota la fila de botons i pot créixer fins a l'amplada
        const controls = document.querySelector('.corner-controls').getBoundingClientRect();
        const buttonsBand = Math.max(0, controls.bottom - clockSection.getBoundingClientRect().top + 6);
        const sizeB = Math.min(available - buttonsBand, maxByWidth, 420);

        // Es queda la que dona l'esfera més gran
        if (sizeB > sizeA + 4) {
            clockSection.style.paddingTop = `${Math.round(buttonsBand)}px`;
            setSize(sizeB);
        }
    }

    function minButtonClearance(svg) {
        const r = svg.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const radius = r.width * 146 / 300;
        let min = Infinity;
        document.querySelectorAll('.corner-controls .ctrl-btn').forEach((btn) => {
            const b = btn.getBoundingClientRect();
            const nx = Math.max(b.left, Math.min(cx, b.right));
            const ny = Math.max(b.top, Math.min(cy, b.bottom));
            min = Math.min(min, Math.hypot(nx - cx, ny - cy) - radius);
        });
        return min;
    }

    // Si el calendari no hi cap (p. ex. iPhone en horitzontal, on la pantalla visible és més baixa que
    // el que diuen les unitats vh), s'encongeix la lletra el just perquè no es talli el nom del mes.
    // Sempre es mesura amb 6 setmanes, així que l'escala no canvia d'un mes a l'altre.
    function fitCalendar() {
        const section = document.querySelector('.calendar-section');
        if (!section) return;
        section.style.setProperty('--cal-scale', '1');
        for (let i = 0; i < 4; i++) {
            // Centrat en vertical, el que sobresurt per dalt no compta a scrollHeight: se sumen les peces
            const cs = getComputedStyle(section);
            const headerRow = section.querySelector('.calendar-header-row');
            const grid = section.querySelector('.calendar-grid');
            const avail = section.clientHeight;
            const need = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) +
                headerRow.offsetHeight + parseFloat(getComputedStyle(headerRow).marginBottom) + grid.offsetHeight;
            if (!avail || need <= avail + 1) break;
            const current = parseFloat(section.style.getPropertyValue('--cal-scale')) || 1;
            const next = Math.max(0.55, current * (avail / need) * 0.98);
            section.style.setProperty('--cal-scale', next.toFixed(3));
        }
    }

    window.addEventListener('resize', () => requestAnimationFrame(fitCalendar));
    window.addEventListener('orientationchange', () => setTimeout(fitCalendar, 300));
    window.addEventListener('resize', sizeClockForPortrait);
    window.addEventListener('orientationchange', () => setTimeout(sizeClockForPortrait, 250));

    // ---------- Navegació del calendari ----------
    function goToCurrentMonth() {
        if (monthOffset !== 0) renderCalendar(0);
    }

    // Un sol gestor per fletxa: toc curt = canvia de mes; prémer llarg = torna al mes actual.
    // (Abans, amb ratolí, el prémer llarg tornava al mes actual i després igualment avançava un mes.)
    function setupNavButton(el, delta) {
        let pressTimer = null;
        let longPressed = false;

        const start = () => {
            longPressed = false;
            clearTimeout(pressTimer);
            pressTimer = setTimeout(() => {
                longPressed = true;
                goToCurrentMonth();
            }, 550);
        };
        const stop = () => {
            clearTimeout(pressTimer);
            pressTimer = null;
        };

        el.addEventListener('pointerdown', start);
        el.addEventListener('pointerup', stop);
        el.addEventListener('pointerleave', stop);
        el.addEventListener('pointercancel', stop);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        el.addEventListener('click', () => {
            if (longPressed) {
                longPressed = false;
                return;
            }
            renderCalendar(monthOffset + delta);
        });
    }

    setupNavButton(document.getElementById('prevMonthBtn'), -1);
    setupNavButton(document.getElementById('nextMonthBtn'), +1);

    // Doble toc/clic al nom del mes torna al mes actual
    const calendarHeaderEl = document.getElementById('calendarHeader');
    calendarHeaderEl.addEventListener('dblclick', goToCurrentMonth);

    let lastHeaderTap = 0;
    calendarHeaderEl.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastHeaderTap < 350) {
            e.preventDefault();
            goToCurrentMonth();
        }
        lastHeaderTap = now;
    });

    // Lliscar a esquerra/dreta sobre el calendari canvia de mes
    let touchStartX = null;
    let touchStartY = null;

    const calendarSectionEl = document.querySelector('.calendar-section');

    calendarSectionEl.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
    }, { passive: true });

    calendarSectionEl.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;
        handleCalendarSwipe(dx, dy);
    }, { passive: true });

    // Amb el ratolí (escriptori) també es pot arrossegar
    let mouseStart = null;
    calendarSectionEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') mouseStart = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointerup', (e) => {
        if (!mouseStart || e.pointerType !== 'mouse') return;
        const dx = e.clientX - mouseStart.x;
        const dy = e.clientY - mouseStart.y;
        mouseStart = null;
        handleCalendarSwipe(dx, dy);
    });

    // Vertical: alterna calendari ⇅ finestra d'informació (avall des del calendari, amunt per tornar).
    // Horitzontal: al calendari canvia de mes; a la finestra d'informació canvia de pàgina.
    function handleCalendarSwipe(dx, dy) {
        const vertical = Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) * 1.5;
        const horizontal = Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5;
        if (vertical) {
            setCalendarView(calendarView === 'calendar' ? 'info' : 'calendar');
        } else if (horizontal && calendarView === 'calendar') {
            renderCalendar(dx < 0 ? monthOffset + 1 : monthOffset - 1);
        } else if (horizontal) {
            // Lliscar cap a la dreta mostra la pàgina de l'esquerra (la data, des de la primera)
            setInfoPage(infoPageIndex + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
        }
    }

    // A l'escriptori, també amb les fletxes del teclat
    document.addEventListener('keydown', (e) => {
        if (e.target.closest && e.target.closest('input, textarea, select')) return;
        if (e.key === 'ArrowDown' && calendarView === 'calendar') setCalendarView('info');
        else if (e.key === 'ArrowUp' && calendarView === 'info') setCalendarView('calendar');
        else if (e.key === 'ArrowLeft') handleCalendarSwipe(60, 0);
        else if (e.key === 'ArrowRight') handleCalendarSwipe(-60, 0);
    });

    // ---------- Requadre del calendari: calendari ⇅ finestra d'informació ----------
    let calendarView = 'calendar';
    const infoViewEl = calendarSectionEl.querySelector('.alt-view--info');

    function setCalendarView(view) {
        calendarView = view;
        hideHolidayTooltip();
        calendarSectionEl.dataset.view = view;
        infoViewEl.setAttribute('aria-hidden', String(view !== 'info'));
        if (view === 'info') {
            renderInfo();
            requestAnimationFrame(fitAltViews);
        }
    }

    // Pàgines, d'esquerra a dreta: data · població i temps (la que surt primer) · indicadors · localització
    const INFO_PAGES = ['date', 'place', 'metrics', 'location'];
    let infoPageIndex = 1;

    function setInfoPage(index, direction = 1) {
        infoPageIndex = (index + INFO_PAGES.length) % INFO_PAGES.length;
        const name = INFO_PAGES[infoPageIndex];
        infoViewEl.querySelectorAll('.info-page').forEach((page) => {
            const active = page.classList.contains(`info-page--${name}`);
            // La pàgina que entra ve del costat cap on llisques; la que surt marxa cap a l'altre
            page.style.setProperty('--page-from', `${(active ? 1 : -1) * direction * 22}px`);
            page.classList.toggle('active', active);
            page.setAttribute('aria-hidden', String(!active));
        });
        infoViewEl.querySelectorAll('.page-dots span').forEach((dot, i) => dot.classList.toggle('active', i === infoPageIndex));
        requestAnimationFrame(fitAltViews);
    }

    function compassPoint(deg) {
        if (deg == null || Number.isNaN(deg)) return '';
        return T().compass[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
    }

    // Omple totes les pàgines amb l'última dada coneguda, en l'idioma triat
    function renderInfo() {
        const t = T();
        const now = new Date();
        const dash = '--';
        const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };

        // Població i temps
        set('pagePlace', wx.city || dash);
        set('altTemp', wx.temp != null ? `${wx.temp}°` : '--°');
        set('altEmoji', currentWeatherEmoji);

        // Data: DIJOUS / 10 d'octubre de 2027
        set('pageWeekday', new Intl.DateTimeFormat(t.locale, { weekday: 'long' }).format(now).toLocaleUpperCase(t.locale));
        let longDate = new Intl.DateTimeFormat(t.locale, { day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        if (currentLang === 'ca') longDate = longDate.replace(/ del (\d{4})$/, ' de $1'); // «10 d’octubre de 2027»
        set('pageLongDate', longDate);

        // Indicadors
        set('mTemp', wx.temp != null ? `${wx.temp}°` : dash);
        set('mFeels', wx.feels != null ? `${wx.feels}°` : dash);
        set('mHum', wx.hum != null ? `${wx.hum}%` : dash);
        const windEl = document.getElementById('mWind');
        if (windEl) {
            windEl.textContent = wx.windSpeed != null ? String(wx.windSpeed) : dash;
            if (wx.windSpeed != null) {
                const unit = document.createElement('small');
                unit.textContent = ' km/h';
                windEl.appendChild(unit);
            }
        }
        const windLabel = infoViewEl.querySelector('.metric--wind .metric-label');
        const dir = wx.windSpeed ? compassPoint(wx.windDir) : '';
        if (windLabel) windLabel.textContent = dir ? `${t.wind} · ${dir}` : t.wind;
        // Localització: el país no es posa si és l'Estat espanyol
        set('locName', wx.city || dash);
        set('locRegion', wx.region || '');
        set('locCountry', wx.countryCode && wx.countryCode !== 'ES' ? (wx.country || '') : '');
        set('mAlt', wx.alt != null ? `${wx.alt} m` : dash);
        if (wx.lat != null && wx.lon != null) {
            const [n, s, e, w] = t.hemi;
            const fmt = v => Math.abs(v).toLocaleString(t.locale, { minimumFractionDigits: 4, maximumFractionDigits: 4 });
            set('mCoords', `${fmt(wx.lat)}° ${wx.lat >= 0 ? n : s}\n${fmt(wx.lon)}° ${wx.lon >= 0 ? e : w}`);
        } else {
            set('mCoords', dash);
        }
        if (!lastWeather) set('mForecast', dash);
        else renderWeatherLabel();

        fitAltViews();
    }

    // La temperatura i el dia de la setmana s'escalen perquè omplin la finestra,
    // sigui quina sigui la font que tingui el dispositiu (Hiragino al Mac/iPhone, una altra a Windows/Android)
    // Nom de la població: si no hi cap en una línia, primer s'encongeix una mica;
    // si encara no hi cap, passa a dues línies equilibrades («Santa Coloma / de Gramenet»)
    // i només s'encongeix més si fa falta. Un nom d'una sola paraula es queda en una línia.
    function fitPlaceName(el) {
        if (!el || !el.parentElement) return;
        el.style.fontSize = '';
        el.style.whiteSpace = 'nowrap';
        const page = el.parentElement;
        const cs = getComputedStyle(page);
        const avail = page.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const base = parseFloat(getComputedStyle(el).fontSize);
        const oneLine = el.scrollWidth;
        if (!avail || !base || !oneLine || oneLine <= avail) return;

        const ratio = avail / oneLine;
        const words = el.textContent.trim().split(/\s+/).length;
        if (ratio >= 0.8 || words < 2) {
            el.style.fontSize = `${Math.floor(base * ratio * 0.98)}px`;
            return;
        }

        el.style.whiteSpace = 'normal';
        let size = base * 0.9;
        for (let i = 0; i < 14; i++) {
            el.style.fontSize = `${Math.floor(size)}px`;
            const lineH = parseFloat(getComputedStyle(el).lineHeight) || size * 1.1;
            const lines = Math.round(el.scrollHeight / lineH);
            if (lines <= 2 && el.scrollWidth <= el.clientWidth + 1) break;
            size *= 0.92;
            if (size < base * 0.4) break;
        }
    }

    function fitAltViews() {
        fitPlaceName(document.getElementById('pagePlace'));
        fitPlaceName(document.getElementById('locName'));
        [['.info-page--place', '.alt-temp-row', 0.84, 0.42],
         ['.info-page--date', '.page-weekday', 0.86, 0.3]].forEach(([pageSel, targetSel, wRatio, hRatio]) => {
            const page = infoViewEl.querySelector(pageSel);
            const el = page && page.querySelector(targetSel);
            if (!el) return;
            const cs = getComputedStyle(page);
            const innerW = page.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const maxW = Math.min(page.clientWidth * wRatio, innerW);
            let maxH = page.clientHeight * hRatio;
            const place = targetSel === '.alt-temp-row' && page.querySelector('.page-place');
            if (place) {
                // Alçada que queda sota el nom de la població (que pot ocupar dues línies)
                const innerH = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
                const placeH = place.offsetHeight + parseFloat(getComputedStyle(place).marginBottom);
                maxH = Math.min(maxH, (innerH - placeH) * 0.92);
            }
            if (!maxW || !maxH) return;
            el.style.fontSize = '100px';
            const w = el.getBoundingClientRect().width;
            if (!w) return;
            el.style.fontSize = `${Math.floor(Math.min(100 * maxW / w, maxH))}px`;
        });
        fitMetricValues();
    }

    // Si una xifra no cap a la seva casella, només aquella s'encongeix (les altres mantenen la mida)
    function fitMetricValues() {
        infoViewEl.querySelectorAll('.metric-main').forEach((main) => {
            main.style.fontSize = '';
            const cell = main.parentElement;
            const avail = cell.clientWidth;
            const value = main.querySelector('.metric-value');
            // La xifra pot estar retallada amb «…»: es compta la seva amplada sencera
            const need = main.scrollWidth + (value ? value.scrollWidth - value.clientWidth : 0);
            if (avail && need > avail) {
                const base = parseFloat(getComputedStyle(main).fontSize);
                main.style.fontSize = `${Math.floor(base * avail / need * 0.97)}px`;
            }
        });
    }

    // Abans hi havia vistes separades; ara tot es refresca des de renderInfo()
    function updateAltViews() {
        renderInfo();
    }

    window.addEventListener('resize', () => requestAnimationFrame(fitAltViews));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAltViews);

    // ---------- Etiqueta dels festius ----------
    const holidayTooltip = document.getElementById('holidayTooltip');
    let tooltipHideTimer = null;
    let tooltipOpenCell = null;

    function hideHolidayTooltip() {
        holidayTooltip.classList.remove('visible');
        tooltipOpenCell = null;
        if (tooltipHideTimer) {
            clearTimeout(tooltipHideTimer);
            tooltipHideTimer = null;
        }
    }

    function showHolidayTooltip(cell) {
        const name = cell.dataset.holidayName;
        if (!name) return;

        holidayTooltip.textContent = name;

        const rect = cell.getBoundingClientRect();
        const top = rect.top - 8;
        let left = rect.left + rect.width / 2;
        const margin = 8;
        const halfTooltip = holidayTooltip.offsetWidth / 2 || 60;
        left = Math.min(Math.max(left, margin + halfTooltip), window.innerWidth - margin - halfTooltip);

        holidayTooltip.style.top = `${top}px`;
        holidayTooltip.style.left = `${left}px`;
        holidayTooltip.classList.add('visible');

        tooltipOpenCell = cell;
        if (tooltipHideTimer) clearTimeout(tooltipHideTimer);
        tooltipHideTimer = setTimeout(hideHolidayTooltip, 3000);
    }

    document.getElementById('calendarGrid').addEventListener('click', (e) => {
        const cell = e.target.closest('.day.holiday');
        if (!cell) {
            hideHolidayTooltip();
            return;
        }
        if (tooltipOpenCell === cell) {
            hideHolidayTooltip();
        } else {
            showHolidayTooltip(cell);
        }
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.day.holiday') && !e.target.closest('.holiday-tooltip')) {
            hideHolidayTooltip();
        }
    });

    // ---------- Avís breu (toast) ----------
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
    }

    // ---------- Tema: automàtic, diürn, nocturn o zz ----------
    // Automàtic segons l'hora local, o forçat amb el botó (cicle: automàtic → diürn → nocturn → zz)
    const THEME_STORAGE_KEY = 'mondaineThemeOverride';
    const THEME_NAMES = { light: 1, dark: 1, zz: 1 }; // noms traduïts a I18N[...].themeNames
    const THEME_COLORS = { light: '#ffffff', dark: '#161616', zz: '#000000' };
    let sessionThemeOverride = null;

    function readStorage(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v === null ? fallback : v;
        } catch (e) {
            return fallback;
        }
    }

    function writeStorage(key, value) {
        try {
            if (value === null) localStorage.removeItem(key);
            else localStorage.setItem(key, value);
        } catch (e) {
            /* localStorage no disponible: el valor només dura la sessió */
        }
    }

    function getThemeOverride() {
        return readStorage(THEME_STORAGE_KEY, sessionThemeOverride);
    }

    function setThemeOverride(value) {
        sessionThemeOverride = value;
        writeStorage(THEME_STORAGE_KEY, value);
    }

    function getAutoTheme() {
        const hour = new Date().getHours();
        return (hour >= 7 && hour < 20) ? 'light' : 'dark';
    }

    function applyTheme() {
        const override = getThemeOverride();
        const effective = THEME_NAMES[override] ? override : getAutoTheme();

        if (document.documentElement.getAttribute('data-theme') !== effective) {
            document.documentElement.setAttribute('data-theme', effective);
        }

        const meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', THEME_COLORS[effective]);

        const btn = document.getElementById('themeToggleBtn');
        btn.classList.toggle('light', effective === 'light');
        btn.classList.toggle('dark', effective === 'dark');
        btn.classList.toggle('zz', effective === 'zz');
        btn.classList.toggle('manual', !!THEME_NAMES[override]);
        const label = THEME_NAMES[override]
            ? T().themeForced(T().themeNames[override])
            : T().themeAutoNow(T().themeNames[effective]);
        btn.setAttribute('aria-label', label);
        btn.title = label;

        updateWakeLock();
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const order = [null, 'light', 'dark', 'zz'];
        const current = THEME_NAMES[getThemeOverride()] ? getThemeOverride() : null;
        const next = order[(order.indexOf(current) + 1) % order.length];
        setThemeOverride(next);
        applyTheme();
        showToast(next ? T().themeToast(T().themeNames[next]) : T().themeAutoToast);
    });

    // Pantalla sempre encesa: amb el botó de l'ull, o sempre en mode zz (tauleta de nit).
    // Fa servir l'API Screen Wake Lock: la pantalla no s'enfosqueix ni es bloqueja mentre l'app és a primer pla.
    const AWAKE_STORAGE_KEY = 'mondaineKeepAwake';
    let keepAwake = readStorage(AWAKE_STORAGE_KEY, '0') === '1';
    let wakeLock = null;

    function applyAwakeButton() {
        const btn = document.getElementById('awakeBtn');
        btn.classList.toggle('on', keepAwake);
        btn.setAttribute('aria-pressed', String(keepAwake));
        btn.setAttribute('aria-label', T().awakeLabel);
        btn.title = T().awakeLabel;
    }

    document.getElementById('awakeBtn').addEventListener('click', () => {
        keepAwake = !keepAwake;
        writeStorage(AWAKE_STORAGE_KEY, keepAwake ? '1' : '0');
        applyAwakeButton();
        if (keepAwake && !('wakeLock' in navigator)) showToast(T().awakeUnsupported);
        else showToast(keepAwake ? T().awakeOn : T().awakeOff);
        updateWakeLock();
    });

    // Alguns navegadors només ho concedeixen després d'un toc: es torna a demanar en tocar la pantalla
    document.addEventListener('click', () => { if (!wakeLock) updateWakeLock(); }, { capture: true });

    async function updateWakeLock() {
        const want = !document.hidden &&
            (keepAwake || document.documentElement.getAttribute('data-theme') === 'zz');
        if (want && !wakeLock && 'wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                wakeLock = null;
            }
        } else if (!want && wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    document.addEventListener('visibilitychange', updateWakeLock);

    // ---------- Anunci horari (en l'idioma triat) ----------
    // L'altaveu només activa o desactiva el so (l'anunci de les hores en punt)
    const VOICE_STORAGE_KEY = 'mondaineVoiceMode';
    const VOICE_MODES = ['off', 'always'];

    let voiceMode = readStorage(VOICE_STORAGE_KEY, 'off');
    if (voiceMode === 'day') voiceMode = 'always'; // l'antic mode «de dia» passa a «activat»
    if (!VOICE_MODES.includes(voiceMode)) voiceMode = 'off';
    let lastAnnounceKey = null;
    let audioCtx = null;

    function pick(options) {
        return options[Math.floor(Math.random() * options.length)];
    }

    // Frases de cada idioma: l'hora, la salutació en activar l'anunci i un anunci amable segons el moment del dia
    const CA_HOURS = ['dotze', 'una', 'dues', 'tres', 'quatre', 'cinc', 'sis', 'set', 'vuit', 'nou', 'deu', 'onze'];
    const FR_HOURS = ['minuit', 'une', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze',
        'midi', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf', 'vingt', 'vingt et une',
        'vingt-deux', 'vingt-trois'];
    const DE_HOURS = ['Mitternacht', 'ein', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf',
        'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn', 'zwanzig',
        'einundzwanzig', 'zweiundzwanzig', 'dreiundzwanzig'];
    const EN_HOURS = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven'];

    const SPEECH = {
        ca: {
            hour(h) {
                if (h === 0) return 'És mitjanit.';
                if (h === 12) return 'És migdia.';
                const h12 = h % 12;
                const part = h <= 5 ? 'de la matinada' : h <= 11 ? 'del matí' : h <= 18 ? 'de la tarda' : h <= 21 ? 'del vespre' : 'de la nit';
                return h12 === 1 ? `És la una ${part}.` : `Són les ${CA_HOURS[h12]} ${part}.`;
            },
            greeting: h => ['Hola!', (h >= 19 || h < 5) ? 'Que passis un bon vespre.' : 'Que passis un bon dia.'],
            friendly(h, hour) {
                if (h >= 5 && h <= 11) return ['Bon dia!', hour];
                if (h === 12) return [hour, pick(['Bon profit!', 'Bona hora de dinar!'])];
                if (h >= 13 && h <= 18) return [hour, pick(['Bona tarda!', 'Que vagi bé la tarda!'])];
                if (h >= 19 && h <= 21) return [pick(['Bon vespre!', 'Bona vesprada!']), hour];
                return [hour, pick(['Bona nit.', 'Dolça nit.'])];
            },
            female: ['montserrat', 'laia', 'núria', 'nuria', 'google català', 'google catalan'],
            male: ['jordi', 'pau', 'arnau', 'enric'],
            region: /^ca[-_]es/i
        },
        fr: {
            hour(h) {
                if (h === 0) return 'Il est minuit.';
                if (h === 12) return 'Il est midi.';
                return `Il est ${FR_HOURS[h]} heure${h === 1 ? '' : 's'}.`;
            },
            greeting: h => ['Salut !', `Je te souhaite une belle ${(h >= 19 || h < 5) ? 'soirée' : 'journée'}.`],
            friendly(h, hour) {
                if (h >= 5 && h <= 11) return ['Bonjour !', hour];
                if (h === 12) return [hour, pick(['Bon appétit !', 'Bonne pause de midi !'])];
                if (h >= 13 && h <= 17) return [hour, pick(['Bon après-midi !', 'Belle après-midi à toi !'])];
                if (h >= 18 && h <= 21) return [pick(['Bonsoir !', 'Bonsoir à toi !']), hour];
                if (h >= 22) return [hour, pick(['Douce soirée.', 'Belle soirée !'])];
                return [hour, 'Douce nuit.'];
            },
            female: ['amélie', 'amelie', 'audrey', 'aurélie', 'aurelie', 'marie', 'virginie', 'julie', 'hortense', 'denise',
                'vivienne', 'eloise', 'éloïse', 'brigitte', 'coralie', 'céline', 'celine', 'léa', 'chantal', 'sylvie',
                'google français', 'google french'],
            male: ['thomas', 'jacques', 'paul', 'henri', 'claude', 'rémy', 'remy', 'nicolas', 'daniel', 'sébastien',
                'olivier', 'antoine', 'jérôme', 'yves', 'fabrice', 'alain', 'guillaume', 'mathieu', 'remi'],
            region: /^fr[-_]fr/i
        },
        de: {
            hour(h) {
                if (h === 0) return 'Es ist Mitternacht.';
                return `Es ist ${DE_HOURS[h]} Uhr.`;
            },
            greeting: h => ['Hallo!', `Ich wünsche dir einen schönen ${(h >= 19 || h < 5) ? 'Abend' : 'Tag'}.`],
            friendly(h, hour) {
                if (h >= 5 && h <= 11) return ['Guten Morgen!', hour];
                if (h === 12) return [hour, pick(['Guten Appetit!', 'Schöne Mittagspause!'])];
                if (h >= 13 && h <= 17) return [hour, pick(['Einen schönen Nachmittag!', 'Hab einen schönen Nachmittag!'])];
                if (h >= 18 && h <= 21) return [pick(['Guten Abend!', 'Einen schönen Abend!']), hour];
                if (h >= 22) return [hour, pick(['Gute Nacht.', 'Schlaf schön.'])];
                return [hour, 'Gute Nacht.'];
            },
            female: ['anna', 'petra', 'helena', 'marlene', 'vicki', 'katja', 'hedda', 'sandy', 'shelley', 'katharina',
                'amala', 'seraphina', 'google deutsch'],
            male: ['markus', 'yannick', 'hans', 'conrad', 'stefan', 'martin', 'florian', 'killian', 'eddy', 'reed', 'rocko', 'grandpa'],
            region: /^de[-_]de/i
        },
        en: {
            hour(h) {
                if (h === 0) return "It's midnight.";
                if (h === 12) return "It's noon.";
                return `It's ${EN_HOURS[h % 12]} o'clock.`;
            },
            greeting: h => ['Hi!', `I wish you a lovely ${(h >= 19 || h < 5) ? 'evening' : 'day'}.`],
            friendly(h, hour) {
                if (h >= 5 && h <= 11) return ['Good morning!', hour];
                if (h === 12) return [hour, pick(['Enjoy your lunch!', 'Time for a lunch break!'])];
                if (h >= 13 && h <= 17) return [hour, pick(['Have a lovely afternoon!', 'Enjoy your afternoon!'])];
                if (h >= 18 && h <= 21) return [pick(['Good evening!', 'Good evening to you!']), hour];
                if (h >= 22) return [hour, pick(['Have a peaceful night.', 'Sweet dreams.'])];
                return [hour, 'Sleep well.'];
            },
            female: ['samantha', 'karen', 'moira', 'tessa', 'serena', 'kate', 'victoria', 'allison', 'ava', 'susan',
                'zira', 'fiona', 'stephanie', 'martha', 'libby', 'sonia', 'female', 'google us english'],
            male: ['daniel', 'alex', 'fred', 'tom', 'oliver', 'arthur', 'david', 'mark', 'george', 'rishi', 'aaron',
                'gordon', 'ralph', 'ryan', 'thomas', 'eddy', 'reed', 'rocko', 'grandpa'],
            region: /^en[-_]gb/i
        }
    };

    function hourPhrase(h) {
        return SPEECH[currentLang].hour(h);
    }

    function activationGreeting(h) {
        return SPEECH[currentLang].greeting(h);
    }

    function friendlyAnnouncement(h) {
        return SPEECH[currentLang].friendly(h, hourPhrase(h));
    }

    // Tria una veu femenina de l'idioma, preferint Google (Chrome) i les de més qualitat (Premium, Millorada…)
    function pickVoice() {
        if (!('speechSynthesis' in window)) return null;
        const conf = SPEECH[currentLang];
        const prefix = new RegExp(`^${currentLang}`, 'i');
        const voices = speechSynthesis.getVoices().filter(v => prefix.test(v.lang));
        let best = null;
        let bestScore = -Infinity;
        voices.forEach(v => {
            const name = v.name.toLowerCase();
            let score = 0;
            if (name.includes('google')) score += 30;
            if (conf.female.some(n => name.includes(n))) score += 10;
            if (/\bmale\b/.test(name) || conf.male.some(n => new RegExp(`\\b${n}\\b`).test(name))) score -= 20;
            if (conf.region.test(v.lang)) score += 3;
            if (/premium|enhanced|natural|neural|amélioré|améliorée|millorada|mejorada|erweitert|siri/i.test(v.name)) score += 4;
            if (v.localService) score += 1;
            if (score > bestScore) {
                bestScore = score;
                best = v;
            }
        });
        return best;
    }

    // Parla una o diverses frases seguides; la pausa natural entre frases fa l'anunci menys "de megafonia".
    // To una mica més alt i ritme més pausat que el per defecte: sona més dolç i proper.
    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let speechUnlocked = false;

    function speak(texts, volume = 1) {
        if (!('speechSynthesis' in window)) return;
        const list = Array.isArray(texts) ? texts : [texts];
        const synth = window.speechSynthesis;

        const run = () => {
            const voice = pickVoice();
            list.forEach((text, i) => {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = T().speech;
                if (voice) u.voice = voice;
                u.rate = 0.86;
                u.pitch = 1.12;
                u.volume = volume;
                if (i === 0) u.onstart = () => { speechUnlocked = true; };
                u.onerror = (ev) => {
                    if (volume > 0 && ev && ev.error && ev.error !== 'canceled' && ev.error !== 'interrupted') {
                        showToast(T().voiceBlocked);
                    }
                };
                synth.speak(u);
            });
        };

        // A l'iPhone, speak() ha de córrer dins del toc: només cancel·lem si hi ha alguna cosa parlant
        try { synth.resume(); } catch (e) { /* res */ }
        if (synth.speaking || synth.pending) {
            synth.cancel();
            setTimeout(run, 80);
        } else {
            run();
        }
    }

    // Desbloqueja la veu amb un toc real (touchend/click; pointerdown no compta a iOS)
    function unlockAudio(e) {
        if (voiceMode === 'off' || speechUnlocked) return;
        if (e && e.target && e.target.closest && e.target.closest('#voiceToggleBtn, #sayTimeBtn')) return; // aquests botons ja parlen ells mateixos
        speak('.', 0.01);
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !IS_IOS) {
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        }
    }

    // Dos tons suaus, com un avís d'estació, abans de la veu
    function playChime() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || IS_IOS) return Promise.resolve(); // a iOS el so web talla la veu: només veu
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

        const start = audioCtx.currentTime + 0.05;
        [[783.99, 0], [659.25, 0.42]].forEach(([freq, offset]) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start + offset);
            gain.gain.exponentialRampToValueAtTime(0.16, start + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + 1.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(start + offset);
            osc.stop(start + offset + 1.4);
        });
        return new Promise(resolve => setTimeout(resolve, 1300));
    }

    function hourKey(now) {
        return `${fmtKey(now)}T${now.getHours()}`;
    }

    function maybeAnnounceHour(now) {
        if (now.getMinutes() !== 0 || now.getSeconds() > 30) return;
        const key = hourKey(now);
        if (key === lastAnnounceKey) return;
        lastAnnounceKey = key;

        const h = now.getHours();
        if (voiceMode === 'off') return;

        playChime().then(() => speak(friendlyAnnouncement(h)));
        if (!speechUnlocked) showToast(T().tapToEnable);
    }

    function applyVoiceButton() {
        const btn = document.getElementById('voiceToggleBtn');
        VOICE_MODES.forEach(m => btn.classList.toggle(m, m === voiceMode));
        btn.setAttribute('aria-label', T().voiceLabels[voiceMode]);
        btn.title = T().voiceLabels[voiceMode];
    }

    // Botó de l'altaveu: cada toc activa o desactiva el so
    const voiceBtn = document.getElementById('voiceToggleBtn');

    function toggleVoice() {
        voiceMode = voiceMode === 'off' ? 'always' : 'off';
        writeStorage(VOICE_STORAGE_KEY, voiceMode);
        applyVoiceButton();
        showToast(T().voiceLabels[voiceMode]);

        // El toc de l'usuari "desbloqueja" l'àudio a l'iPhone, i de pas se sent la veu triada
        if (voiceMode === 'always') {
            speak(activationGreeting(new Date().getHours()));
        } else if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
        }
    }

    voiceBtn.addEventListener('click', toggleVoice);

    // ---------- Botó «digues l'hora» ----------
    // Diu l'hora exacta en l'idioma triat. En català, amb el sistema tradicional de quarts
    // (sempre es compta cap a l'hora que ve: «un quart de dues» = 13:15).
    const CA_NUM = ['', 'un', 'dos', 'tres', 'quatre', 'cinc', 'sis', 'set'];

    function caPartOfDay(h) {
        if (h === 0) return 'de la nit';
        if (h <= 5) return 'de la matinada';
        if (h <= 11) return 'del matí';
        if (h === 12) return 'del migdia';
        if (h <= 18) return 'de la tarda';
        if (h <= 21) return 'del vespre';
        return 'de la nit';
    }

    // «de dues», «d'una», «d'onze»
    function caDeHour(h) {
        const word = CA_HOURS[h % 12];
        return /^[aeiouàèéíòóú]/i.test(word) ? `d’${word}` : `de ${word}`;
    }

    function caMinutes(n) {
        return n === 1 ? 'un minut' : `${CA_NUM[n]} minuts`;
    }

    function catalanTime(now) {
        const h = now.getHours();
        const m = now.getMinutes();
        const next = (h + 1) % 24;
        const nextName = `${caDeHour(next)} ${caPartOfDay(next)}`;
        const isOne = h % 12 === 1;

        if (m === 0) {
            if (h === 0) return 'És mitjanit en punt.';
            if (h === 12) return 'És migdia en punt.';
            return isOne ? `És la una en punt ${caPartOfDay(h)}.` : `Són les ${CA_HOURS[h % 12]} en punt ${caPartOfDay(h)}.`;
        }
        if (m <= 6) {
            return isOne ? `És la una i ${caMinutes(m)} ${caPartOfDay(h)}.`
                : `Són les ${CA_HOURS[h % 12]} i ${caMinutes(m)} ${caPartOfDay(h)}.`;
        }
        if (m >= 54) {
            const left = 60 - m;
            const nextWord = CA_HOURS[next % 12];
            const target = next % 12 === 1 ? 'la una' : `les ${nextWord}`;
            return `${left === 1 ? 'Falta un minut' : `Falten ${CA_NUM[left]} minuts`} per a ${target} ${caPartOfDay(next)}.`;
        }

        // De 7 a 53 minuts: quarts, mig quart, i «i N» / «menys N»
        const QUARTS = ['', 'un quart', 'dos quarts', 'tres quarts'];
        const verb = q => (q <= 1 ? 'És' : 'Són');
        const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

        if (m === 7 || m === 8) return `És mig quart ${nextName}.`;
        const q = Math.round(m / 15);          // quart més proper (1, 2 o 3)
        const diff = m - q * 15;               // de -6 a +6 respecte d'aquest quart
        if (diff === 0) return `${verb(q)} ${QUARTS[q]} ${nextName}.`;
        if (diff === 7 || diff === 8) return `${verb(q)} ${QUARTS[q]} i mig ${nextName}.`;
        if (diff > 0) return `${verb(q)} ${QUARTS[q]} i ${CA_NUM[diff]} ${nextName}.`;
        // Uns minuts abans d'un quart
        if (-diff === 7 || -diff === 8) return cap(`${verb(q - 1)} ${QUARTS[q - 1]} i mig ${nextName}.`);
        return `${verb(q)} ${QUARTS[q]} menys ${CA_NUM[-diff]} ${nextName}.`;
    }

    const TELL_TIME = {
        ca: catalanTime,
        fr(now) {
            const h = now.getHours(), m = now.getMinutes();
            if (m === 0) return SPEECH.fr.hour(h);
            if (h === 0) return `Il est minuit ${m}.`;
            if (h === 12) return `Il est midi ${m}.`;
            return `Il est ${h} heure${h === 1 ? '' : 's'} ${m}.`;
        },
        de(now) {
            const h = now.getHours(), m = now.getMinutes();
            if (m === 0) return SPEECH.de.hour(h);
            return `Es ist ${h} Uhr ${m}.`;
        },
        en(now) {
            const h = now.getHours(), m = now.getMinutes();
            if (m === 0) return SPEECH.en.hour(h);
            const h12 = h % 12 === 0 ? 12 : h % 12;
            return `It's ${h12}:${String(m).padStart(2, '0')} ${h < 12 ? 'a.m.' : 'p.m.'}`;
        }
    };

    function tellTime(now = new Date()) {
        return (TELL_TIME[currentLang] || TELL_TIME.ca)(now);
    }

    const sayTimeBtn = document.getElementById('sayTimeBtn');

    sayTimeBtn.addEventListener('click', () => {
        const text = tellTime();
        showToast(text);
        speak(text); // dins del toc: també sona a l'iPhone, encara que l'anunci horari estigui desactivat
        sayTimeBtn.classList.add('speaking');
        setTimeout(() => sayTimeBtn.classList.remove('speaking'), 2500);
    });

    function applySayTimeButton() {
        sayTimeBtn.setAttribute('aria-label', T().sayTime);
        sayTimeBtn.title = T().sayTime;
    }

    // Si l'anunci ja estava activat d'una sessió anterior, el primer toc real desbloqueja la veu
    ['touchend', 'click'].forEach((t) => document.addEventListener(t, unlockAudio, { capture: true, passive: true }));

    if ('speechSynthesis' in window) {
        // Algunes plataformes carreguen la llista de veus amb retard
        speechSynthesis.getVoices();
        speechSynthesis.addEventListener?.('voiceschanged', () => speechSynthesis.getVoices());
    }


    // ---------- Gir 3D de l'esfera, amb la bandera de l'idioma triat al revers ----------
    const FLAG_SVG = {
        // Senyera: quatre barres vermelles sobre groc
        ca: '<rect width="32" height="32" fill="#FCDD09"/>' +
            [1, 3, 5, 7].map(i => `<rect y="${(i * 32 / 9).toFixed(3)}" width="32" height="${(32 / 9).toFixed(3)}" fill="#DA121A"/>`).join(''),
        fr: '<rect width="32" height="32" fill="#FFFFFF"/><rect width="10.67" height="32" fill="#0055A4"/><rect x="21.33" width="10.67" height="32" fill="#EF4135"/>',
        de: '<rect width="32" height="10.67" fill="#000000"/><rect y="10.67" width="32" height="10.67" fill="#DD0000"/><rect y="21.33" width="32" height="10.67" fill="#FFCE00"/>',
        // Union Jack (retall quadrat del centre)
        en: '<rect width="32" height="32" fill="#012169"/>' +
            '<path d="M0 0L32 32M32 0L0 32" stroke="#FFFFFF" stroke-width="6.4"/>' +
            '<path d="M0 0L32 32M32 0L0 32" stroke="#C8102E" stroke-width="2.1"/>' +
            '<path d="M16 0V32M0 16H32" stroke="#FFFFFF" stroke-width="10"/>' +
            '<path d="M16 0V32M0 16H32" stroke="#C8102E" stroke-width="6"/>'
    };

    function renderBackFlag() {
        const flag = document.getElementById('backFlag');
        if (!flag) return;
        flag.innerHTML = `<defs><clipPath id="flagCircle"><circle cx="16" cy="16" r="16"/></clipPath></defs>` +
            `<g clip-path="url(#flagCircle)">${FLAG_SVG[currentLang] || FLAG_SVG.ca}</g>`;
        flag.setAttribute('aria-label', T().langName);
    }

    const clockFlip = document.getElementById('clockFlip');
    const EDGE_LAYERS = 19;

    // Capes del cantell (com les parets d'un cilindre tancat), creades una sola vegada
    (function buildClockEdge() {
        for (let i = 0; i < EDGE_LAYERS; i++) {
            const layer = document.createElement('div');
            layer.className = 'clock-edge';
            const k = (i / (EDGE_LAYERS - 1)) - 0.5; // de -0,5 a +0,5 del gruix
            layer.style.transform = `translateZ(calc(var(--thick) * ${k.toFixed(3)}))`;
            clockFlip.insertBefore(layer, clockFlip.firstChild);
        }
    })();

    function spinClock() {
        if (!clockFlip || clockFlip.classList.contains('girant')) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        renderBackFlag();
        // Gruix proporcional a la mida de l'esfera (com el model: ~40 px per a 360 px)
        const size = clockFlip.getBoundingClientRect().width;
        clockFlip.style.setProperty('--thick', `${Math.round(size * 0.11)}px`);
        clockFlip.classList.add('girant');
    }

    clockFlip.addEventListener('animationend', () => clockFlip.classList.remove('girant'));

    // 5 segons després d'obrir l'app, una volta sencera de 8 segons
    setTimeout(spinClock, 5000);

    // ---------- Selector d'idioma ----------
    const langControl = document.getElementById('langControl');
    const langBtn = document.getElementById('langBtn');

    function setLangMenuOpen(open) {
        langControl.classList.toggle('open', open);
        langBtn.setAttribute('aria-expanded', String(open));
    }

    function applyLanguage() {
        const t = T();
        document.documentElement.setAttribute('lang', currentLang);

        document.querySelectorAll('[data-i18n-label]').forEach((el) => {
            const text = t[el.dataset.i18nLabel];
            el.setAttribute('aria-label', text);
            if (el.classList.contains('widget')) el.title = text;
        });
        document.querySelectorAll('#calendarGrid .day-name').forEach((el, i) => { el.textContent = t.days[i]; });

        langBtn.textContent = currentLang.toUpperCase();
        langBtn.setAttribute('aria-label', `${t.language}: ${t.langName}`);
        langBtn.title = `${t.language}: ${t.langName}`;
        document.getElementById('langMenu').setAttribute('aria-label', t.language);
        document.querySelectorAll('.lang-option').forEach((el) => {
            el.setAttribute('aria-checked', String(el.dataset.lang === currentLang));
            el.setAttribute('aria-label', I18N[el.dataset.lang].langName);
        });

        document.querySelectorAll('[data-i18n-text]').forEach((el) => {
            el.textContent = t[el.dataset.i18nText] || '';
        });
        renderInfo();
        applyAwakeButton();
        renderBackFlag();
        renderInstallBanner();
        applySayTimeButton();
        applyVoiceButton();
        applyTheme();
        renderCalendar();
    }

    function setLanguage(lang) {
        if (!LANGS.includes(lang) || lang === currentLang) return;
        currentLang = lang;
        writeStorage(LANG_STORAGE_KEY, lang);
        applyLanguage();
        showToast(T().langToast);

        // El nom de la població també es tradueix (p. ex. Barcelone, Barcelona…)
        lastGeoCoords = null;
        if (fetchInProgress) setTimeout(fetchLocationData, 4000);
        else fetchLocationData();

        // Si l'anunci és actiu, se sent la salutació en el nou idioma (dins del toc: també sona a l'iPhone)
        if (voiceMode !== 'off') speak(activationGreeting(new Date().getHours()));
    }

    langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setLangMenuOpen(!langControl.classList.contains('open'));
    });

    document.querySelectorAll('.lang-option').forEach((el) => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            setLanguage(el.dataset.lang);
            setLangMenuOpen(false);
        });
    });

    document.addEventListener('click', (e) => {
        if (!langControl.contains(e.target)) setLangMenuOpen(false);
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setLangMenuOpen(false);
    });

    // ---------- Avís d'instal·lació ----------
    // Android i escriptori (Chrome/Edge): botó «Instal·la» que obre el diàleg del sistema.
    // iPhone/iPad (Safari): no hi ha botó possible; s'expliquen els dos tocs per afegir-la.
    // No surt si l'app ja està instal·lada ni durant uns dies si l'has tancat.
    const INSTALL_DISMISS_KEY = 'rellotgeInstallDismissed';
    const INSTALL_DISMISS_DAYS = 14;
    const installBanner = document.getElementById('installBanner');
    let deferredInstallPrompt = null;
    let installMode = null; // 'prompt' | 'ios'

    const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;

    function installDismissedRecently() {
        const t = parseInt(readStorage(INSTALL_DISMISS_KEY, '0'), 10) || 0;
        return Date.now() - t < INSTALL_DISMISS_DAYS * 24 * 3600 * 1000;
    }

    function renderInstallBanner() {
        if (!installMode) return;
        const t = T();
        document.getElementById('installTitle').textContent = t.installTitle;
        const hint = document.getElementById('installHint');
        const action = document.getElementById('installAction');
        if (installMode === 'ios') {
            const share = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
            hint.innerHTML = t.installHintIos.replace('{share}', share);
            action.hidden = true;
        } else {
            hint.textContent = t.installHintAndroid;
            action.textContent = t.installButton;
            action.hidden = false;
        }
        document.getElementById('installClose').setAttribute('aria-label', t.installTitle + ' ×');
    }

    function showInstallBanner(mode) {
        if (isStandalone() || installDismissedRecently()) return;
        installMode = mode;
        renderInstallBanner();
        installBanner.hidden = false;
        requestAnimationFrame(() => requestAnimationFrame(() => installBanner.classList.add('visible')));
    }

    function hideInstallBanner(remember) {
        if (remember) writeStorage(INSTALL_DISMISS_KEY, String(Date.now()));
        installBanner.classList.remove('visible');
        setTimeout(() => { installBanner.hidden = true; }, 320);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); // el mostrem nosaltres, amb el nostre avís
        deferredInstallPrompt = e;
        setTimeout(() => showInstallBanner('prompt'), 1200);
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        hideInstallBanner(false);
    });

    document.getElementById('installAction').addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        try {
            const choice = await deferredInstallPrompt.userChoice;
            if (choice && choice.outcome !== 'accepted') writeStorage(INSTALL_DISMISS_KEY, String(Date.now()));
        } catch (err) { /* res */ }
        deferredInstallPrompt = null;
        hideInstallBanner(false);
    });

    document.getElementById('installClose').addEventListener('click', () => hideInstallBanner(true));

    // Safari d'iPhone/iPad no avisa: es mostra l'explicació si no s'està fent servir ja com a app
    if (IS_IOS && !isStandalone() && location.protocol.startsWith('http')) {
        setTimeout(() => showInstallBanner('ios'), 1500);
    }

    // ---------- Inici ----------
    lastAnnounceKey = hourKey(new Date()); // no s'anuncia l'hora només per obrir la pàgina
    setInfoPage(infoPageIndex);
    applyLanguage(); // textos, botons, tema i calendari
    currentDateKey = fmtKey(new Date());
    refreshOfficialHolidays(false);
    fetchLocationData();
    requestAnimationFrame(updateClock);
    sizeClockForPortrait();
    setTimeout(sizeClockForPortrait, 300);
    requestAnimationFrame(fitCalendar);
    setTimeout(fitCalendar, 350);

    // Les transicions de tema s'activen només després del primer pintat
    requestAnimationFrame(() => requestAnimationFrame(() => {
        document.documentElement.classList.add('theme-ready');
    }));

    // App instal·lable: el service worker només funciona servit per http(s), no obrint el fitxer directament
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
