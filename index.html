        })();

        :root {
            --mondaine-red: #e30613;
            --mondaine-black: #000000;
            /* Fons uniforme: la pantalla i la targeta tenen el mateix color en cada mode */
            --bg-color: #161616;
            --card-bg: #161616;
            --widget-bg: #262626;
            --widget-text: #a0a0a5;
            --text-color: #ffffff;
            --border-color: #2a2a2a;
            --border-color-soft: #333333;
            --nav-active-bg: rgba(255, 255, 255, 0.08);
            --card-shadow: rgba(0, 0, 0, 0.6);
            --today-text: #ffffff;
            --today-glow: rgba(227, 6, 19, 0.6);
            --transition-theme: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        html[data-theme="light"] {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --widget-bg: #f1f2f5;
            --widget-text: #6c7076;
            --text-color: #18181a;
            --border-color: #dde0e4;
            --border-color-soft: #e4e6ea;
            --nav-active-bg: rgba(0, 0, 0, 0.06);
            --card-shadow: rgba(30, 30, 40, 0.18);
        }

        /* Mode zz (tauleta de nit): tot negre amb un sol to taronja.
           Per tornar al vermell pur de la imatge de referència, canvia --zz per #ff0000 i --zz-rgb per 255, 0, 0 */
        html[data-theme="zz"] {
            --zz: #ff4500;
            --zz-rgb: 255, 69, 0;
            --zz-dim: rgba(var(--zz-rgb), 0.45);
            --mondaine-red: var(--zz);
            --bg-color: #000000;
            --card-bg: #000000;
            --widget-bg: #000000;
            --widget-text: rgba(var(--zz-rgb), 0.6);
            --text-color: var(--zz);
            --border-color: rgba(var(--zz-rgb), 0.14);
            --border-color-soft: rgba(var(--zz-rgb), 0.22);
            --nav-active-bg: rgba(var(--zz-rgb), 0.14);
            --card-shadow: transparent;
            --today-text: #000000;
            --today-glow: rgba(var(--zz-rgb), 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* Fins que el tema no està aplicat, cap transició (evita animar el canvi inicial) */
        html:not(.theme-ready) *,
        html:not(.theme-ready) body {
            transition: none !important;
        }

        body {
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vh, 24px);
            /* Respecta la "illa" / notch de l'iPhone, sobretot en horitzontal */
            padding-top: max(clamp(8px, 2vh, 24px), env(safe-area-inset-top));
            padding-bottom: max(clamp(8px, 2vh, 24px), env(safe-area-inset-bottom));
            padding-left: max(clamp(8px, 2vh, 24px), env(safe-area-inset-left));
            padding-right: max(clamp(8px, 2vh, 24px), env(safe-area-inset-right));
            color: var(--text-color);
            transition: var(--transition-theme);
            /* Evita el zoom per doble toc quan es premen les fletxes ràpidament */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .app-card {
            position: relative;
            background-color: var(--card-bg);
            border-radius: clamp(16px, 4vw, 28px);
            box-shadow: none;
            border: none;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 100%;
            padding: clamp(12px, 3vh, 24px);
            transition: var(--transition-theme);
            display: grid;
            grid-template-areas:
                "clock"
                "info"
                "calendar";
            /* minmax(0, 1fr): sense això, la franja lliscable d'indicadors eixampla la columna
               i desplaça el rellotge i el calendari fora de la pantalla */
            grid-template-columns: minmax(0, 1fr);
            /* La fila del rellotge s'emporta l'espai sobrant (el rellotge es dimensiona per JS) */
            grid-template-rows: minmax(0, 1fr) auto auto;
            align-items: stretch;
            gap: clamp(8px, 2vh, 20px);
            overflow: hidden;
        }

        .clock-section,
        .info-section,
        .calendar-section {
            min-width: 0;
        }

        .clock-section {
            grid-area: clock;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .clock-svg {
            width: min(62vw, 38vh, 300px);
            height: auto;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: clamp(6px, 1.5vh, 16px);
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.4));
            flex-shrink: 0;
        }

        .hand-shadow {
            filter: drop-shadow(2px 5px 5px rgba(0, 0, 0, 0.35));
        }

        .info-section {
            grid-area: info;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.2vh, 12px);
        }

        .widgets-container {
            width: 100%;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            gap: clamp(6px, 1.2vh, 10px);
            padding-right: 24px;
            flex-shrink: 0;
        }

        .widgets-container::-webkit-scrollbar {
            display: none;
        }

        /* Difuminat a les vores per indicar que hi ha més indicadors a banda i banda */
        .widgets-container.fade-right {
            -webkit-mask-image: linear-gradient(to right, #000 82%, transparent);
            mask-image: linear-gradient(to right, #000 82%, transparent);
        }

        .widgets-container.fade-left {
            -webkit-mask-image: linear-gradient(to left, #000 82%, transparent);
            mask-image: linear-gradient(to left, #000 82%, transparent);
        }

        .widgets-container.fade-left.fade-right {
            -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
        }

        @media (hover: hover) and (pointer: fine) {
            .widgets-container {
                cursor: grab;
            }

            .widgets-container.dragging {
                cursor: grabbing;
                scroll-snap-type: none;
                user-select: none;
            }
        }

        /* Cada indicador és una "pastilla" amb la icona al costat del valor: ocupa just el que necessita */
        .widget {
            flex: 0 0 auto;
            min-width: 0;
            background-color: var(--widget-bg);
            border-radius: 14px;
            padding: clamp(7px, 1.1vh, 10px) 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--border-color-soft);
            overflow: hidden;
            scroll-snap-align: start;
            transition: var(--transition-theme);
        }

        .widget-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--widget-text);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .widget-value,
        .location-value {
            font-size: clamp(0.85rem, 3.9vw, 1rem);
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.1;
            white-space: nowrap;
        }

        /* La població s'adapta a la llargada del nom (fins a un màxim) */
        .widget--location {
            max-width: 230px;
        }

        .location-value {
            min-width: 0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calendar-section {
            grid-area: calendar;
            position: relative;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--widget-bg);
            padding: clamp(8px, 1.5vh, 18px);
            border-radius: 20px;
            border: 1px solid var(--border-color-soft);
            overflow: hidden;
            transition: var(--transition-theme);
        }

        /* Lliscar en vertical sobre el calendari canvia de vista: el navegador no ha de desplaçar la pàgina */
        .calendar-section {
            container-type: inline-size;
            touch-action: none;
        }

        /* El calendari es manté a dins (invisible) quan es veu una altra vista: així el marc
           conserva la mida i el rellotge no salta */
        .calendar-header-row,
        .calendar-grid {
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s;
        }

        .calendar-section:not([data-view="calendar"]) .calendar-header-row,
        .calendar-section:not([data-view="calendar"]) .calendar-grid {
            opacity: 0;
            visibility: hidden;
            transform: translateY(14px);
        }

        .alt-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-14px);
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s;
            pointer-events: none;
            /* Les mides del text es calculen sobre el requadre sencer: així omplen l'espai del calendari */
            container-type: size;
            padding: 6% 8%;
        }

        .calendar-section[data-view="date"] .alt-view--date,
        .calendar-section[data-view="temp"] .alt-view--temp {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        .alt-big {
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 800;
            font-size: min(21cqw, 46cqh);
            line-height: 1;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            white-space: nowrap;
        }

        .alt-caption {
            margin-top: 0.6em;
            max-width: 90%;
            font-size: min(5cqw, 8cqh);
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--widget-text);
            text-transform: capitalize;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .alt-temp-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.08em;
        }

        .alt-temp-row .alt-big {
            font-size: min(21cqw, 46cqh);
        }

        .alt-emoji {
            font-size: min(17cqw, 36cqh);
            line-height: 1;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        }

        /* En mode zz l'emoticona també passa a to taronja apagat, per no enlluernar de nit */
        html[data-theme="zz"] .alt-emoji {
            /* silueta d'un sol color: el text transparent i una ombra taronja sense desplaçament */
            color: transparent;
            text-shadow: 0 0 0 var(--zz);
            opacity: 0.85;
        }

        .calendar-section {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Tres puntets a la dreta indiquen quina vista es veu */
        .view-dots {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: none;
        }

        .view-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--widget-text);
            opacity: 0.35;
            transition: opacity 0.2s ease, background-color 0.2s ease;
        }

        .calendar-section[data-view="calendar"] .view-dots span:nth-child(1),
        .calendar-section[data-view="date"] .view-dots span:nth-child(2),
        .calendar-section[data-view="temp"] .view-dots span:nth-child(3) {
            opacity: 1;
            background-color: var(--mondaine-red);
        }

        .holiday-tooltip {
            position: fixed;
            z-index: 50;
            transform: translate(-50%, -100%);
            background-color: #000000;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--mondaine-red);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .holiday-tooltip.visible {
            opacity: 1;
        }

        .holiday-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #000000;
        }

        .calendar-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 14px);
            margin-bottom: clamp(4px, 1vh, 16px);
            flex-shrink: 0;
        }

        .calendar-header {
            text-align: center;
            font-weight: 700;
            font-size: clamp(0.9rem, 3vw, 1.25rem);
            text-transform: capitalize;
            color: var(--text-color);
            min-width: 0;
            white-space: nowrap; /* el nom del mes mai no passa a dues línies */
            padding: 4px 6px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .cal-nav-btn {
            background: none;
            border: none;
            color: var(--widget-text);
            font-size: clamp(1rem, 3vw, 1.3rem);
            line-height: 1;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .cal-nav-btn:active {
            background-color: var(--nav-active-bg);
        }

        .cal-nav-btn {
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .calendar-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, auto);
            gap: clamp(4px, 1vh, 10px);
            text-align: center;
            align-items: center;
            justify-items: center;
        }

        .day-name {
            font-weight: 600;
            font-size: clamp(0.6rem, min(2vw, 2.4vh), 0.85rem);
            color: var(--widget-text);
        }

        .day {
            position: relative;
            font-size: clamp(0.65rem, min(2.2vw, 2.6vh), 0.95rem);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.9em;
            height: 1.9em;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .day.today .day-number {
            background-color: var(--mondaine-red);
            color: var(--today-text);
            font-weight: 700;
            box-shadow: 0 0 12px var(--today-glow);
        }

        .day.holiday:not(.today) .day-number {
            color: var(--mondaine-red);
            font-weight: 700;
        }

        .day.holiday::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--mondaine-red);
        }

        .day.today.holiday::after {
            background-color: var(--today-text);
        }

        .day.empty {
            visibility: hidden;
        }

        /* Botons de la cantonada: anunci horari i tema */
        /* En vertical, un botó a cada cantonada superior: un rellotge rodó mai no arriba a les
           cantonades del seu quadrat, així que els botons no el poden tapar sigui quina sigui la mida */
        .corner-controls {
            position: absolute;
            top: clamp(8px, 2vh, 14px);
            left: clamp(8px, 2vh, 14px);
            right: clamp(8px, 2vh, 14px);
            display: flex;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .corner-controls .ctrl-btn {
            pointer-events: auto;
        }

        .ctrl-btn {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: var(--widget-bg);
            border: 1px solid var(--border-color-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: var(--transition-theme);
            -webkit-touch-callout: none;
        }

        .ctrl-btn:active {
            background-color: var(--nav-active-bg);
        }

        .ctrl-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: none;
        }

        .theme-toggle-btn.light .icon-sun,
        .theme-toggle-btn.dark .icon-moon,
        .theme-toggle-btn.zz .icon-zz,
        .voice-toggle-btn.off .icon-voice-off,
        .voice-toggle-btn.always .icon-voice-on,
        .voice-toggle-btn.day .icon-voice-on {
            display: block;
        }

        .voice-toggle-btn.holding {
            box-shadow: 0 0 0 3px var(--mondaine-red);
        }

        .voice-toggle-btn.off svg {
            stroke: var(--widget-text);
        }

        /* Puntet vermell: tema forçat manualment */
        .ctrl-btn .auto-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--mondaine-red);
            border: 1.5px solid var(--card-bg);
            display: none;
        }

        .theme-toggle-btn.manual .auto-dot {
            display: block;
        }

        /* Petit sol: anunci només de dia (7 h – 23 h) */
        .voice-day-badge {
            position: absolute;
            right: -4px;
            bottom: -4px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color-soft);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .voice-toggle-btn.day .voice-day-badge {
            display: flex;
        }

        .ctrl-btn .voice-day-badge svg {
            display: block;
            width: 11px;
            height: 11px;
            stroke-width: 2.4;
        }

        /* Selector d'idioma: a la cantonada inferior dreta de la zona del rellotge,
           on l'esfera rodona tampoc no hi arriba */
        .ctrl-group {
            display: flex;
            gap: 8px;
        }

        .lang-control {
            position: relative;
        }

        .lang-btn {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-color);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            display: flex;
            gap: 4px;
            padding: 4px;
            border-radius: 999px;
            background-color: var(--widget-bg);
            border: 1px solid var(--border-color-soft);
            box-shadow: 0 6px 18px var(--card-shadow);
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .lang-control.open .lang-menu {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .lang-option {
            min-width: 34px;
            height: 30px;
            padding: 0 8px;
            border-radius: 999px;
            border: none;
            background: none;
            color: var(--widget-text);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
        }

        .lang-option[aria-checked="true"] {
            background-color: var(--mondaine-red);
            color: #ffffff;
        }

        html[data-theme="zz"] .lang-option[aria-checked="true"] {
            color: #000000;
        }

        /* Avís breu en canviar un mode */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            transform: translate(-50%, 12px);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 60;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- Mode zz: el rellotge també passa a negre i taronja, sense ombres ---------- */
        html[data-theme="zz"] .clock-svg,
        html[data-theme="zz"] .hand-shadow,
        html[data-theme="zz"] #dial-marks {
            filter: none;
        }

        html[data-theme="zz"] .clock-dial { fill: #000000; stroke: #000000; }
        html[data-theme="zz"] .clock-brand { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-badge { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-badge-cross { fill: #000000; }
        html[data-theme="zz"] .mark-hour { stroke: var(--zz); }
        html[data-theme="zz"] .mark-minute { stroke: var(--zz-dim); }
        html[data-theme="zz"] .hand { stroke: var(--zz); }
        html[data-theme="zz"] .second-line { stroke: var(--zz-dim); }
        html[data-theme="zz"] .second-dot { fill: var(--zz-dim); }
        html[data-theme="zz"] .clock-cap { fill: var(--zz); }

        html[data-theme="zz"] .day:not(.today):not(.holiday) .day-number {
            opacity: 0.8;
        }

        html[data-theme="zz"] .holiday-tooltip,
        html[data-theme="zz"] .toast {
            background-color: #000000;
            color: var(--zz);
            border: 1px solid var(--zz-dim);
        }

        html[data-theme="zz"] .holiday-tooltip::after {
            border-top-color: var(--zz-dim);
        }

        @media (orientation: landscape) {
            .app-card {
                max-width: min(96vw, 1200px);
                /* Calendari + indicadors formen un bloc centrat verticalment al costat del rellotge.
                   La columna dreta té un màxim (calendari compacte) i el rellotge s'emporta la resta */
                grid-template-areas:
                    "clock ."
                    "clock controls"
                    "clock calendar"
                    "clock info"
                    "clock .";
                grid-template-columns: minmax(0, 1fr) minmax(0, clamp(240px, 36vw, 340px));
                grid-template-rows: minmax(0, 1fr) auto auto auto minmax(0, 1fr);
                align-items: stretch;
                column-gap: clamp(12px, 3vw, 40px);
                row-gap: clamp(6px, 1.6vh, 14px);
            }

            /* Els botons passen a la columna dreta, damunt del calendari: mai no tapen res */
            .corner-controls {
                position: static;
                grid-area: controls;
                justify-self: end;
                justify-content: flex-end;
            }

            /* El rellotge es dimensiona segons la seva pròpia columna (abans ho feia segons
               l'amplada de la pantalla i, en pantalles estretes, quedava sota el calendari) */
            .clock-section {
                container-type: size;
                justify-self: stretch;
                align-self: stretch;
            }

            .clock-svg {
                height: auto;
                width: min(32vw, 64vh);
                width: min(100cqw, 100cqh, 560px);
                margin-bottom: 0;
            }

            .calendar-section {
                justify-content: center;
                width: 100%;
            }

            .widget-value,
            .location-value {
                font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            }

            .calendar-header {
                font-size: clamp(0.9rem, 1.8vw, 1.3rem);
                margin-bottom: clamp(2px, 0.8vh, 10px);
            }

            .calendar-grid {
                gap: clamp(3px, 0.8vh, 8px);
            }

            .day-name {
                font-size: clamp(0.6rem, 1.3vw, 0.85rem);
            }

            .day {
                font-size: clamp(0.65rem, 1.4vw, 0.9rem);
            }

            .day-number {
                width: 1.8em;
                height: 1.8em;
            }

            .info-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="corner-controls">
        <button class="ctrl-btn voice-toggle-btn off" id="voiceToggleBtn" type="button" aria-label="Anunci horari: silenciat">
            <svg class="icon-voice-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9h3l5-4v14l-5-4H4z"/>
                <path d="M16 9.5l5 5M21 9.5l-5 5"/>

    function detectDefaultLang() {
        try {
            const stored = localStorage.getItem(LANG_STORAGE_KEY);
            if (LANGS.includes(stored)) return stored;
        } catch (e) { /* res */ }
        return 'ca';
    }

    let currentLang = detectDefaultLang();
    const T = () => I18N[currentLang];

    // ---------- Rellotge ----------
    const marksGroup = document.getElementById('dial-marks');
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const isHour = i % 5 === 0;

        const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
        mark.setAttribute("x1", "150");
        mark.setAttribute("y1", "22");
        mark.setAttribute("x2", "150");
        mark.setAttribute("y2", isHour ? "52" : "32");
        mark.setAttribute("stroke", "#000000");
        mark.setAttribute("stroke-width", isHour ? "11" : "3.5");
        mark.setAttribute("stroke-linecap", "butt");
        mark.setAttribute("class", isHour ? "mark-hour" : "mark-minute");
        mark.setAttribute("transform", `rotate(${angle} 150 150)`);
        marksGroup.appendChild(mark);
    }

    const secondHandEl = document.getElementById('secondHand');
    const minuteHandEl = document.getElementById('minuteHand');
    const hourHandEl = document.getElementById('hourHand');

    let currentMinute = -1;
    let currentDateKey = null;

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // Stop2Go: la segonera fa la volta en 58 s i s'atura 2 s a les 12
        const secondAngle = s < 58 ? ((s * 1000 + ms) / 58000) * 360 : 360;
        const minuteAngle = m * 6;
        const hourAngle = ((h % 12) * 30) + (m * 0.5);

        secondHandEl.setAttribute('transform', `rotate(${secondAngle} 150 150)`);
        minuteHandEl.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
        hourHandEl.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

        checkMinute(now);
        requestAnimationFrame(updateClock);
    }

    // Es comprova també amb un temporitzador: requestAnimationFrame s'atura quan la pestanya
    // no es veu, i a l'escriptori volem que l'anunci horari soni igualment
    function checkMinute(now) {
        const m = now.getMinutes();
        if (m !== currentMinute) {
            currentMinute = m;
            onMinuteChange(now);
        }
    }

    setInterval(() => checkMinute(new Date()), 1000);

    function onMinuteChange(now) {
        updateAltViews();
        // Canvi de dia: es compara la data, no l'hora 00:00, perquè si la pàgina estava
        // en segon pla a mitjanit el navegador no executa el rellotge i aquell minut es perdria
        const dateKey = fmtKey(now);
        if (dateKey !== currentDateKey) {
            const firstRun = currentDateKey === null;
            currentDateKey = dateKey;
            if (!firstRun) renderCalendar(0);
        }
        applyTheme();
        maybeAnnounceHour(now);
    }

    // ---------- Festius ----------
    // Festes personals: es marquen cada any, a més de les oficials
    const PERSONAL_HOLIDAYS = {
        '10-01': 'Dia de la República'
    };

    // Còpia de seguretat dels calendaris oficials (font: dades obertes de la Generalitat).
    // Normalment no cal tocar-ho: l'app es baixa la llista oficial i s'actualitza sola.
    const OFFICIAL_HOLIDAYS = {
        2026: {
            '01-01': "Cap d'Any",
            '01-06': 'Reis',
            '04-03': 'Divendres Sant',
            '04-06': 'Dilluns de Pasqua Florida',

            '01-01': "Cap d'Any",
            '01-06': 'Reis',
            '03-26': 'Divendres Sant',
            '03-29': 'Dilluns de Pasqua Florida',
            '05-01': 'Festa del Treball',

    // Per a anys que encara no tenen calendari oficial publicat: regla general (aproximada)
    const GENERIC_FIXED_HOLIDAYS = {
        '01-01': "Cap d'Any",
        '01-06': 'Reis',
        '05-01': 'Festa del Treball',
        '06-24': 'Sant Joan',
        '08-15': "L'Assumpció",
        '09-11': 'Diada Nacional de Catalunya',
        '10-12': "Festa Nacional d'Espanya",
